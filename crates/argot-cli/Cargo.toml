[package]
name = "argot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "argot — voice linter CLI. Single statically-linked binary replacing the TS/Bun CLI and Python engine."
# Not published to crates.io (internal path deps); distributed as a prebuilt
# binary via cargo-dist + npm. `dist = true` keeps it in the release plan even
# though it is unpublishable.
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "argot"
path = "src/main.rs"

[features]
# Off by default: only shipped binaries need the update path (ureq TLS stack,
# plus the Windows-only self-replace dance). Release builds enable it via
# dist-workspace.toml; CI and dev loops skip the whole tree. Update resolution
# goes through the published version.json + release web download URLs — never
# the GitHub API and its anonymous 60 req/h rate limit (src/update.rs).
self-update = ["dep:ureq", "dep:self-replace"]
# Compiles in the semantic layer (embeddings-backed findings). This is a
# build-time gate, not a user opt-in: the shipped binary is built with it on and
# semantic is standard, always-on behaviour. Dev/CI base loops leave it off for
# the lean pure-Rust build. Forwards to argot-core's `semantic` feature.
semantic = ["argot-core/semantic"]
# Compiles in the architecture-graph layer (module-dependency-boundary findings,
# reason `layering`). Build-time gate like `semantic`; forwards to argot-core's
# `arch` feature. Off in dev/CI base loops; ON in releases (dist-workspace.toml).
arch = ["argot-core/arch"]
# Compiles in the test-integrity layer (test-gaming findings, rules
# `test-deleted`/`test-disabled`/`test-weakened`). Build-time gate like `arch`;
# off in dev/CI base loops; ON in releases (dist-workspace.toml).
integrity = ["argot-core/integrity"]
script = ["argot-core/script", "dep:argot-rules-script"]

[dependencies]
argot-core = { path = "../argot-core" }
argot-rules-script = { path = "../argot-rules-script", optional = true }
# Already compiled via argot-core; declared here for audit's history walk.
git2 = { workspace = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
self-replace = { workspace = true, optional = true }

[lints]
workspace = true
