[package]
name = "argot-rules-semantic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal crate: shipped only inside the `argot` binary, never published to
# crates.io (path deps forbid it). Marked non-publishable so it cannot leak.
publish = false
description = "The semantic rule group: per-repo code embeddings powering the reinvention (F1) and placement (F2) findings, plus F4 nearest-code evidence. Pure Rust — the distilled embedder's weights ship inside the binary. No cargo features: the whole crate IS the feature, gated one layer up by argot-core's optional dependency."

[dependencies]
argot-engine = { path = "../argot-engine" }
argot-lang = { path = "../argot-lang" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
git2.workspace = true
half = { workspace = true }
base64 = { workspace = true }
safetensors = "0.8.0"
tokenizers.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
