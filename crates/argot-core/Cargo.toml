[package]
name = "argot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal crate: shipped only inside the `argot` binary, never published to
# crates.io (path deps forbid it). Marked non-publishable so it cannot leak.
publish = false
description = "Facade + composition root: re-exports argot-engine/argot-lang/argot-rules-voice at their historical paths and wires this build's rule groups (voice always-on, semantic/architecture/integrity additive) into the engine's check loop."

[dependencies]
argot-lang = { path = "../argot-lang" }
argot-engine = { path = "../argot-engine" }
# The voice rule group always ships — unlike the additive slices below, it is
# not an optional dependency behind a cargo feature.
argot-rules-voice = { path = "../argot-rules-voice" }
# Only for the `scoring::calibration::run_calibrate` facade wrapper's return
# type (it closes over `compose::fit_detectors()`, so it can't just be a
# `pub use` of the voice crate's own `run_calibrate`).
anyhow.workspace = true

# --- additive rule-group slices (feature-gated; absent from the base build) ---
# Each slice is its own crate with no cargo features of its own — the whole
# crate IS the feature; compiling it in is decided here, by making it an
# optional dependency gated behind the matching feature below.
argot-rules-semantic = { path = "../argot-rules-semantic", optional = true }
argot-rules-arch = { path = "../argot-rules-arch", optional = true }
argot-rules-integrity = { path = "../argot-rules-integrity", optional = true }
argot-rules-script = { path = "../argot-rules-script", optional = true }

[features]
# The semantic sense: per-repo code embeddings powering the reinvention (F1),
# placement (F2) and nearest-code-evidence (F4) capabilities. In the shipped
# product this is a STANDARD, always-on capability — not a user opt-in and no
# runtime toggle; the released binary is built with it on (see
# dist-workspace.toml) and the model auto-downloads on first use.
#
# The Cargo feature nonetheless defaults OFF purely as a BUILD-TIME gate: it lets
# the dev/CI lean loop (`cargo build`, `just verify`) compile pure-Rust with no
# cmake/llama.cpp toolchain, and lets CI prove the base statistical guardrail is
# byte-for-byte unchanged and zero-cost when the layer is absent. Invisible to
# users — it governs how the binary is built, not whether the feature is on.
semantic = ["dep:argot-rules-semantic"]

# The structural-foreignness sense: node-kind bigrams as a repo's structural
# vocabulary (the shape analog of the foreign-vocabulary gate). Pure-Rust, NO new
# deps — the gate is purely a build-time boundary so the base guardrail stays
# byte-for-byte unchanged and the layer stays advisory / measurement-only (it is
# never wired into the gating exit code). Enabled by the bench to validate the
# irreducible floor (docs/research/evidence/foreign-structure-gate-floor.md); NOT
# enabled in the released binary (unlike `semantic`), because the floor proves it
# is not gatable. Lives in `argot-rules-voice` (the crate whose `scoring` module
# it extends); this feature just forwards the build-time gate through.
structural = ["argot-rules-voice/structural"]

# The architecture-graph sense: a repo's module-dependency topology + the
# reversal/sink-out fire rule (the relationship analog of the vocabulary gate).
# Pure-Rust, NO new deps; a build-time boundary so the base guardrail stays
# byte-for-byte unchanged. Enabled by the bench; ON in releases.
arch = ["dep:argot-rules-arch"]

# The test-integrity sense: catches an agent gaming tests to green a failing
# suite (weakening / disabling / deleting them alongside a production change).
# Pure-Rust, NO new deps — reads both sides of the diff, builds per-version
# test inventories with the pinned tree-sitter grammars, and diffs them into
# events (rules `test-deleted` / `test-disabled` / `test-weakened`, group
# `integrity`). Same build-time-gate shape as `arch`: off in dev/CI base loops
# so the base guardrail is provably byte-for-byte unchanged; ON in releases
# (dist-workspace.toml). Evidence: docs/research/evidence/test-integrity-*.md.
integrity = ["dep:argot-rules-integrity"]
# Scripted community rules from `.argot/rules/` (Rhai + manifest). Pure
# Rust; ON in releases (dist-workspace.toml).
script = ["dep:argot-rules-script"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
