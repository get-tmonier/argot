[package]
name = "argot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Voice-linter engine: git walk, tokenization, statistical scorers, calibration (language- and corpus-agnostic)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-c.workspace = true
tree-sitter-java.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-php.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-ruby.workspace = true
git2.workspace = true
tokenizers.workspace = true
md-5.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
toml.workspace = true
toml_edit.workspace = true

# --- semantic layer (feature-gated; absent from the base build) ---
# Optional here, no accel backend; macOS adds Metal via the target table below.
llama-cpp-2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
half = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Metal acceleration on macOS only. Cargo unifies this with the base optional
# entry above, so a macOS `--features semantic` build links llama.cpp with Metal
# while Linux/Windows fall back to CPU (the release matrix wires other backends).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["metal"] }

[features]
# The semantic sense: per-repo code embeddings powering the reinvention (F1),
# placement (F2) and nearest-code-evidence (F4) capabilities. In the shipped
# product this is a STANDARD, always-on capability — not a user opt-in and no
# runtime toggle; the released binary is built with it on (see
# dist-workspace.toml) and the model auto-downloads on first use.
#
# The Cargo feature nonetheless defaults OFF purely as a BUILD-TIME gate: it lets
# the dev/CI lean loop (`cargo build`, `just verify`) compile pure-Rust with no
# cmake/llama.cpp toolchain, and lets CI prove the base statistical guardrail is
# byte-for-byte unchanged and zero-cost when the layer is absent. Invisible to
# users — it governs how the binary is built, not whether the feature is on.
semantic = ["dep:llama-cpp-2", "dep:ureq", "dep:half", "dep:base64"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
