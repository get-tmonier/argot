[package]
name = "argot-bench"
description = "Benchmark harness: recall / false-positive evaluation of the argot scorer over the pinned corpora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Dev tool — never published or shipped in releases (see dist-workspace.toml).
publish = false

[[bin]]
name = "argot-bench"
path = "src/main.rs"

[dependencies]
argot-core = { path = "../argot-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# YAML parsing for benchmarks/targets.yaml + catalog manifests (bench-only dep).
serde_yaml = "0.9"
sha2.workspace = true
# integrity-fp mode replays accepted history directly (feature-gated;
# already compiled via argot-core).
git2 = { workspace = true, optional = true }

[features]
# Enables the structural-foreignness floor validation (`--mode structural`),
# which drives argot-core's feature-gated `structural` sense over real corpora +
# real temporal-holdout. Off by default: the base bench never depends on it.
structural = ["argot-core/structural"]

# Enables the architecture-graph floor/gate validation (`--mode arch`), which drives
# argot-core's feature-gated `arch_graph` sense over real corpora + real holdout.
arch = ["argot-core/arch"]

# Enables the test-integrity validation (`--mode integrity-verify`), which
# drives argot-core's feature-gated test-gaming detector over authored gaming
# fixtures + replayed accepted history.
integrity = ["argot-core/integrity", "dep:git2"]

# The explicit release-composition benchmark build. Kept opt-in so normal
# deterministic aggregation tests do not download the semantic model.
release-composition = ["argot-core/semantic", "argot-core/arch", "argot-core/integrity", "argot-core/script", "integrity"]

[lints]
workspace = true
