[package]
name = "argot-rules-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal crate: shipped only inside the `argot` binary, never published to
# crates.io (path deps forbid it). Marked non-publishable so it cannot leak.
publish = false
description = "The scripted rule group: community rules loaded at run time from `.argot/rules/<name>/` (a TOML manifest + a Rhai detection script) — no recompilation. The native host API does the heavy lifting (tree-sitter queries, learned-model facts); scripts orchestrate and report. No cargo features — the whole crate IS the feature, gated one layer up by argot-core's optional dependency."

[dependencies]
argot-engine = { path = "../argot-engine" }
argot-lang = { path = "../argot-lang" }
# Pinned minor: the Rhai language surface is part of the rule-author contract
# (rules are written against the host API; the interpreter shouldn't drift under them).
rhai = "1.25"
serde.workspace = true
serde_json.workspace = true
# tree-sitter 0.25+ returns a StreamingIterator from QueryCursor::matches;
# the trait lives in this crate (a tree-sitter dependency).
streaming-iterator = "0.1"
toml.workspace = true
tree-sitter.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
