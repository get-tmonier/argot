# libgit2 1.8.1 calls Win32 security, registry, and legacy crypto APIs through
# advapi32. libgit2-sys 0.17.0+1.8.1 (held by git2 0.19) omits that system
# library from its vendored Windows build, so every Windows test binary that
# reaches git2 otherwise fails to link (CI-08 / #306).
[target.'cfg(windows)']
rustflags = ["-l", "advapi32"]
