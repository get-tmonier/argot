# Composite GitHub Action for argot — voice linter that learns a repo's voice
# from git history. See https://argot.tmonier.com/docs/ci/ for copy-paste workflows.
#
# Non-blocking by default: argot is a probabilistic guardrail, so it
# informs the PR with observed configured findings and inline annotations without gating the
# merge. The reviewer has the last word (opt into `fail-on-hits` for a hard gate).
#
# What it does:
#   1. Downloads the prebuilt `argot` binary from this repo's GitHub Releases
#      (cargo-dist artifacts: argot-{target}.tar.gz).
#   2. Fits the voice model on the *base* ref (the PR's target branch, or the
#      parent commit on a push) — never the PR head, so a PR's own new code is
#      judged as new instead of self-certifying it. The `.argot/` model is cached
#      per base commit and re-fit only when the base advances. Needs full history
#      (`actions/checkout` with `fetch-depth: 0`).
#   3. Runs `argot check --format <format>` on base..HEAD and writes it to a file.
#   4. Renders a non-blocking configured-findings card into the Actions job summary,
#      and (on pull requests) into a single sticky PR comment.
#   5. Optionally uploads the SARIF file to GitHub code scanning.
#   6. Optionally publishes a shields.io configured-findings badge to a `badges`
#      branch (publish-badge: true; needs `contents: write`) so a README badge
#      stays fresh — see https://argot.tmonier.com/docs/ci/ for the snippet.
#
# Supported runners: Linux (x64/arm64), macOS (arm64/x64), and Windows (x64) —
# the targets argot publishes prebuilt binaries for.
#
# Note: checking a ref range (the default on pull requests) needs git history.
# Use `actions/checkout` with `fetch-depth: 0`.

name: "argot"
description: "Summarize configured findings on a PR — non-blocking by default, with a job summary, PR comment, and SARIF code-scanning annotations."
branding:
  icon: "mic"
  color: "purple"

inputs:
  path:
    description: "Path to the repository to check (working-directory relative)."
    required: false
    default: "."
  argot-version:
    description: "argot release to install: 'latest' or a version like '0.2.43'."
    required: false
    default: "latest"
  format:
    description: "Output format for `argot check`: sarif, json, github (inline PR annotations), or human."
    required: false
    default: "sarif"
  output-file:
    description: "File the check results are written to."
    required: false
    default: "argot-results.sarif"
  ref:
    description: >-
      Git ref or range to check (e.g. 'origin/main..HEAD'). Empty = automatic:
      base..HEAD on pull requests, the head commit on pushes.
    required: false
    default: ""
  cache:
    description: "Cache the fitted .argot/ model directory between runs."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload the SARIF file to GitHub code scanning (requires format: sarif and `security-events: write`)."
    required: false
    default: "true"
  comment-pr:
    description: "Post/update a non-blocking configured-findings comment on the pull request (requires `pull-requests: write`)."
    required: false
    default: "true"
  rules:
    description: >-
      Space-separated rule severity overrides passed to `argot check --rule`,
      e.g. 'misplaced=warn semantic=off'. Empty = the repo's argot.toml [rules]
      (everything error by default).
    required: false
    default: ""
  semantic:
    description: >-
      Run the semantic rules (redundant/misplaced) in CI. 'false' passes
      `--rule semantic=off` to the check, so neither rule reports; the voice,
      layering and integrity rules still run. The embedder ships inside the
      binary, so an air-gapped runner needs no special handling and there is
      nothing to download either way.
    required: false
    default: "true"
  fail-on-hits:
    description: >-
      Fail the job when argot finds hunks above the calibrated threshold.
      Off by default: argot is a statistical guardrail, so it informs the PR
      (configured-findings card + code-scanning annotations) without gating the merge. Opt in
      only if you deliberately want a hard gate.
    required: false
    default: "false"
  publish-badge:
    description: >-
      On a push to the default branch, publish a shields.io endpoint JSON
      (the scanned change's configured-finding count) to a `badges` branch, so a README badge
      stays fresh. Off by default; needs `contents: write`. Embed it with
      `[![argot](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/OWNER/REPO/badges/argot.json)](https://argot.tmonier.com)`.
    required: false
    default: "false"

outputs:
  exit-code:
    description: "Exit code of `argot check` (0 clean, 1 hits found, 2 setup/usage error)."
    value: ${{ steps.check.outputs.exit-code }}
  results-file:
    description: "Path to the written results file."
    value: ${{ steps.check.outputs.results-file }}

runs:
  using: "composite"
  steps:
    - name: Install argot
      shell: bash
      env:
        ARGOT_VERSION: ${{ inputs.argot-version }}
      run: |
        set -euo pipefail
        # Unix ships .tar.gz; Windows ships .zip with argot.exe.
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   target="x86_64-unknown-linux-gnu"; ext="tar.gz"; bin="argot" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu"; ext="tar.gz"; bin="argot" ;;
          macOS-ARM64) target="aarch64-apple-darwin"; ext="tar.gz"; bin="argot" ;;
          macOS-X64)   target="x86_64-apple-darwin"; ext="tar.gz"; bin="argot" ;;
          Windows-X64) target="x86_64-pc-windows-msvc"; ext="zip"; bin="argot.exe" ;;
          *)
            echo "::error::argot publishes prebuilt binaries for Linux (x64/arm64), macOS (arm64/x64), and Windows (x64); got ${RUNNER_OS}-${RUNNER_ARCH}"
            exit 1
            ;;
        esac
        if [ "$ARGOT_VERSION" = "latest" ]; then
          url="https://github.com/get-tmonier/argot/releases/latest/download/argot-${target}.${ext}"
        else
          url="https://github.com/get-tmonier/argot/releases/download/v${ARGOT_VERSION#v}/argot-${target}.${ext}"
        fi
        install_dir="${RUNNER_TEMP}/argot-bin"
        mkdir -p "$install_dir"
        archive="${RUNNER_TEMP}/argot.${ext}"
        echo "Downloading $url"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 "$url" -o "$archive"
        # Verify the archive against the release's per-artifact SHA-256 sidecar
        # (cargo-dist publishes `<artifact>.sha256` next to every binary) before
        # trusting the download. Fail closed: a missing sidecar or a mismatch
        # aborts the install. sha256sum on Linux / Git-Bash-on-Windows, shasum
        # on macOS.
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 "${url}.sha256" -o "${archive}.sha256"
        expected="$(awk '{print $1}' "${archive}.sha256")"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum < "$archive" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
        fi
        if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
          echo "::error::argot binary checksum verification failed for ${url} (expected '${expected:-<none>}', got '${actual}')"
          exit 1
        fi
        echo "Checksum verified: $actual"
        # cargo-dist wraps Unix archives in a target directory, while the
        # Windows ZIP stores its files at the archive root.
        if [ "$ext" = "zip" ]; then
          # Git Bash tar misreads a drive-letter destination (for example
          # D:\\a\\_temp) as a remote archive target. Let PowerShell consume
          # the native Windows paths instead.
          ARCHIVE="$archive" INSTALL_DIR="$install_dir" powershell -NoProfile -NonInteractive -Command 'Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:INSTALL_DIR -Force'
        else
          tar -xf "$archive" -C "$install_dir" --strip-components=1
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/$bin" --version

    - name: Resolve base ref and range
      id: base
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        ARGOT_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        g() { git -C "$ARGOT_PATH" "$@"; }
        orig_sha="$(g rev-parse HEAD)"
        base_sha="$orig_sha"
        range=""
        if [ -n "$ARGOT_REF" ]; then
          range="$ARGOT_REF"
          # A range fits on its left side; a bare ref fits on itself.
          base_sha="$(g rev-parse "${ARGOT_REF%%..*}" 2>/dev/null || echo "$orig_sha")"
        elif [ -n "${GITHUB_BASE_REF:-}" ]; then
          # Pull request: the base branch is the established voice.
          base_sha="$(g rev-parse "origin/${GITHUB_BASE_REF}")"
          range="origin/${GITHUB_BASE_REF}..HEAD"
        elif g rev-parse --verify -q HEAD~1 >/dev/null; then
          # Push: fit on the parent, score the pushed commit.
          base_sha="$(g rev-parse HEAD~1)"
          range="HEAD~1..HEAD"
        fi
        {
          echo "orig_sha=$orig_sha"
          echo "base_sha=$base_sha"
          echo "range=$range"
        } >> "$GITHUB_OUTPUT"
        echo "voice learned from base $base_sha; scoring '${range:-HEAD}'."

    # The machine-wide, content-addressed embedding cache. Independent of the
    # base-keyed `.argot` below: on a base advance (or a fresh runner) where
    # the `.argot` model misses, unchanged functions still serve their vectors
    # from here instead of re-embedding — an incremental re-fit. Loosely keyed
    # with restore-keys so it accumulates across runs (512 MB self-capped);
    # deleting it only costs recompute, never correctness.
    - name: Cache the embedding vectors
      if: ${{ inputs.cache == 'true' && inputs.semantic == 'true' }}
      uses: actions/cache@v6
      with:
        path: ~/.cache/argot/embeddings
        key: argot-embeddings-${{ runner.os }}-${{ inputs.argot-version }}-${{ steps.base.outputs.base_sha }}
        restore-keys: |
          argot-embeddings-${{ runner.os }}-${{ inputs.argot-version }}-

    # The model cache is a SLOT that runs off the default branch refresh and
    # pull requests read — not a per-commit key. Keying it on the base commit
    # meant it missed whenever the branch moved, which is always, so every pull
    # request refit: on a 924k-line repository that is 2 min 03 of a 2 min 06
    # job, against a check that takes ~2 s. Nobody keeps a tool that costs two
    # minutes a PR.
    #
    # The unique suffix exists because `actions/cache` will not overwrite an
    # existing key: a producer run needs a key nobody has written so its fresh
    # model is stored, and the `restore-keys` prefix is what every consumer
    # reads — it resolves to the most recently created cache in the slot.
    # GitHub makes a cache written on the base branch visible to every pull
    # request targeting it, which is what makes one producer serve everyone.
    - name: Restore the voice model
      if: ${{ inputs.cache == 'true' }}
      id: model-cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.path }}/.argot
        key: argot-model-${{ runner.os }}-${{ inputs.argot-version }}-v1-${{ github.sha }}
        restore-keys: |
          argot-model-${{ runner.os }}-${{ inputs.argot-version }}-v1-

    # Producer or consumer? A run off the default branch refreshes the slot and
    # pays the fit; a pull request reads it and pays nothing. That split is what
    # keeps the check at seconds for contributors, and it puts the cost where
    # every project already accepts it — post-merge, on nobody's critical path.
    #
    # A pull request still refits in two cases: no model exists at all (the
    # first run on a repository, or the slot expired after 7 idle days), and the
    # base's argot.toml has changed since the model was fitted — a scope change
    # is not staleness, it means the model learned from a different corpus.
    - name: Plan this run
      id: plan
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        BASE_SHA: ${{ steps.base.outputs.base_sha }}
        ORIG_SHA: ${{ steps.base.outputs.orig_sha }}
        CACHE: ${{ inputs.cache }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        fit=true
        reason=refresh
        behind=
        if [ "$CACHE" != 'true' ]; then
          reason=cache-disabled
        elif [ ! -f "$ARGOT_PATH/.argot/scorer-config.json" ]; then
          reason=seed
        elif [ "$EVENT" = 'pull_request' ] || [ "$EVENT" = 'pull_request_target' ]; then
          # Ask argot the same question its local auto-refresh asks, from the
          # base — which is the tree the check scores against. Do not silence
          # this: a swallowed error here reads as "refit", which is exactly the
          # cost this step exists to avoid, and it would do so silently.
          git -C "$ARGOT_PATH" checkout -q --detach "$BASE_SHA"
          status=$(argot status --repo "$ARGOT_PATH" --format json) || status='{}'
          git -C "$ARGOT_PATH" checkout -q --detach "$ORIG_SHA"
          behind=$(jq -r '.health.commits_behind // empty' <<<"$status")
          if [ "$(jq -r '.calibrated // false' <<<"$status")" = true ] \
             && [ "$(jq -r '.health.config_in_sync // false' <<<"$status")" = true ]; then
            fit=false
            reason=reuse
          else
            reason=config-changed
          fi
        fi
        # Say it out loud too: the decision drives the whole cost of the run,
        # and a step that only writes to $GITHUB_OUTPUT leaves nothing to debug.
        echo "argot: fit=$fit reason=$reason behind=${behind:-n/a}"
        {
          echo "fit=$fit"
          echo "reason=$reason"
          echo "behind=${behind:-}"
        } >> "$GITHUB_OUTPUT"

    - name: Fit voice model on the base
      id: fit
      if: ${{ steps.plan.outputs.fit == 'true' }}
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        BASE_SHA: ${{ steps.base.outputs.base_sha }}
        ORIG_SHA: ${{ steps.base.outputs.orig_sha }}
      run: |
        set -euo pipefail
        # Learn the repo's established voice from the BASE tree — NOT the PR head.
        # Fitting on the head would train on the PR's own new code and hide its
        # configured findings (a PR that adds `import axios` would see none).
        # The fitted .argot/ model survives the checkout
        # (it's gitignored), so we restore the original ref afterward.
        git -C "$ARGOT_PATH" checkout -q --detach "$BASE_SHA"
        started=$(date +%s)
        argot fit --repo "$ARGOT_PATH"
        echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
        # Defense in depth: `argot fit` is side-effect-free on the tracked tree,
        # but should anything leave the working copy dirty (a stray untracked
        # file, a hook), a plain checkout would abort and fail the non-blocking
        # check. Reset tracked files and drop untracked ones first — `clean`
        # WITHOUT `-x` preserves the gitignored, freshly-fitted `.argot/` model.
        git -C "$ARGOT_PATH" reset -q --hard
        git -C "$ARGOT_PATH" clean -fdq
        git -C "$ARGOT_PATH" checkout -q --detach "$ORIG_SHA"

    - name: Run argot check
      id: check
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        ARGOT_RANGE: ${{ steps.base.outputs.range }}
        ARGOT_FORMAT: ${{ inputs.format }}
        ARGOT_OUT: ${{ inputs.output-file }}
        ARGOT_RULES: ${{ inputs.rules }}
        # `semantic: false` is enforced on the check, which is the surface that
        # takes rule overrides — `argot fit` has no `--rule`. The fit still
        # builds the index, which now costs ~1.5 s of an 81 s fit; before the
        # embedder shipped in the binary this switch also avoided a ~100 MB
        # download, and that is the part that no longer exists.
        ARGOT_SEMANTIC_OFF: ${{ inputs.semantic != 'true' && '1' || '' }}
      run: |
        set -euo pipefail
        # Score the same range the base was resolved from, against the base-fit
        # model — so a PR's own new code is judged as new, not self-certified.
        args=()
        if [ -n "$ARGOT_RANGE" ]; then
          args+=("$ARGOT_RANGE")
        else
          args+=(--commit HEAD)
        fi
        for rule in $ARGOT_RULES; do
          args+=(--rule "$rule")
        done
        if [ -n "${ARGOT_SEMANTIC_OFF:-}" ]; then
          args+=(--rule semantic=off)
        fi
        set +e
        argot check --repo "$ARGOT_PATH" "${args[@]}" --format "$ARGOT_FORMAT" > "$ARGOT_OUT"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "results-file=$ARGOT_OUT" >> "$GITHUB_OUTPUT"
        if [ "$code" -ge 2 ]; then
          echo "::error::argot check failed (exit $code)"
          cat "$ARGOT_OUT" || true
          exit "$code"
        fi
        if [ "$code" -eq 1 ]; then
          echo "argot found hunks above the calibrated threshold (see $ARGOT_OUT)."
        else
          echo "argot check clean."
        fi

    # Why did this job take two minutes? Without this, the answer is only in the
    # raw log: on anything but an exact key hit the whole voice model is
    # refitted, which dwarfs the check itself.
    #
    # Note the distinction the summary draws. `actions/cache` reports
    # `cache-hit: true` only on an EXACT key match; a restore via `restore-keys`
    # leaves it false, so the fit still runs and the restored artifact only
    # serves to seed the semantic index — nothing at all when `semantic: false`.
    # Saying "restored" would therefore be misleading; what matters is whether
    # the fit ran.
    - name: Explain the run's cost
      if: ${{ always() }}
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache }}
        REASON: ${{ steps.plan.outputs.reason }}
        BEHIND: ${{ steps.plan.outputs.behind }}
        FIT_SECONDS: ${{ steps.fit.outputs.seconds }}
        BASE_SHA: ${{ steps.base.outputs.base_sha }}
      run: |
        set -euo pipefail
        {
          echo
          case "$REASON" in
            reuse)
              echo "<sub>Scored against the cached voice model, ${BEHIND:-0} accepted commit(s) behind base \`${BASE_SHA:0:12}\` — no fit on this pull request."
              echo "The fit runs after merge, on the default branch, and refreshes the model every pull request reads.</sub>" ;;
            refresh)
              echo "<sub>Refreshed the voice model for every pull request to read — fitted in ${FIT_SECONDS:-?}s.</sub>" ;;
            seed)
              echo "<sub>No cached voice model yet, so this run fitted one in ${FIT_SECONDS:-?}s and seeded the cache."
              echo "Pull requests from here on read it and skip the fit. The cache expires after 7 idle days.</sub>" ;;
            config-changed)
              echo "<sub>\`argot.toml\` changed since the cached model was fitted, so it was refitted in ${FIT_SECONDS:-?}s."
              echo "A scope change is not staleness — the model has to learn from the corpus the config now describes.</sub>" ;;
            cache-disabled)
              echo "<sub>Model cache disabled (\`cache: false\`) — fitted the base in ${FIT_SECONDS:-?}s.</sub>" ;;
          esac
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Configured findings card
      id: card
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        ARGOT_RANGE: ${{ steps.base.outputs.range }}
      run: |
        set -euo pipefail
        # Same range the check scored, summarized against the base-fit model.
        range="$ARGOT_RANGE"
        if [ -z "$range" ]; then
          echo "No diff range to summarize — skipping the configured-findings card."
          echo "card=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        card="${RUNNER_TEMP}/argot-findings-card.md"
        # Informational: never let card rendering fail the job.
        if argot voice-diff "$range" --repo "$ARGOT_PATH" --format markdown > "$card" 2>/dev/null; then
          # Findings card in the Actions run UI — no extra permissions, fork-safe.
          cat "$card" >> "$GITHUB_STEP_SUMMARY"
          echo "card=$card" >> "$GITHUB_OUTPUT"
        else
          echo "voice-diff could not summarize '$range' (is the model fitted?) — skipping card."
          echo "card=" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment configured findings on the PR
      if: ${{ inputs.comment-pr == 'true' && github.event_name == 'pull_request' && steps.card.outputs.card != '' }}
      uses: actions/github-script@v9
      env:
        ARGOT_CARD: ${{ steps.card.outputs.card }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- argot-configured-findings -->';
          const body = marker + '\n' + fs.readFileSync(process.env.ARGOT_CARD, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          // Sticky comment: update the one we already posted, or create it once.
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Generate configured-findings badge
      id: badge
      if: ${{ inputs.publish-badge == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.base.outputs.range != '' }}
      shell: bash
      env:
        ARGOT_PATH: ${{ inputs.path }}
        ARGOT_RANGE: ${{ steps.base.outputs.range }}
      run: |
        set -euo pipefail
        # Reuse the same range the check scored — no extra fit. The shields
        # endpoint JSON is a single line; hand it to the publish step as output.
        json="$(argot voice-diff "$ARGOT_RANGE" --repo "$ARGOT_PATH" --format shields 2>/dev/null || true)"
        if [ -z "$json" ]; then
          echo "voice-diff produced no findings badge JSON (model not fitted?) — publishing neutral state."
          json='{"schemaVersion":1,"label":"argot","message":"unknown","color":"lightgrey"}'
        fi
        printf 'json=%s\n' "$json" >> "$GITHUB_OUTPUT"

    - name: Publish configured-findings badge to the badges branch
      if: ${{ steps.badge.outputs.json != '' }}
      uses: actions/github-script@v9
      env:
        ARGOT_BADGE_JSON: ${{ steps.badge.outputs.json }}
      with:
        github-token: ${{ github.token }}
        script: |
          const content = (process.env.ARGOT_BADGE_JSON || '').trim() + '\n';
          const { owner, repo } = context.repo;
          const branch = 'badges';
          const path = 'argot.json';
          // Unchanged findings summary → no commit, so a quiet repo never churns history.
          try {
            const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const cur = Buffer.from(existing.data.content, 'base64').toString('utf8');
            if (cur.trim() === content.trim()) { core.info('argot findings badge unchanged — no commit.'); return; }
          } catch (e) { /* file or branch absent → created below */ }
          const blob = await github.rest.git.createBlob({
            owner, repo, encoding: 'base64',
            content: Buffer.from(content).toString('base64'),
          });
          // Build on the current badges head when it exists (preserving any
          // sibling badge files), else start a root commit for a new branch.
          let parents = [];
          let base_tree;
          try {
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            parents = [ref.data.object.sha];
            const head = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha });
            base_tree = head.data.tree.sha;
          } catch (e) { /* branch absent — root commit */ }
          const tree = await github.rest.git.createTree({
            owner, repo,
            ...(base_tree ? { base_tree } : {}),
            tree: [{ path, mode: '100644', type: 'blob', sha: blob.data.sha }],
          });
          const commit = await github.rest.git.createCommit({
            owner, repo, tree: tree.data.sha, parents,
            message: 'chore(argot): update findings badge [skip ci]',
          });
          try {
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: true });
          } catch (e) {
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
          }
          core.info(`argot findings badge published → ${branch}/${path}`);

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.output-file }}
        category: argot

    - name: Fail on hits
      if: ${{ inputs.fail-on-hits == 'true' && steps.check.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error::argot found hunks above the calibrated threshold — see the uploaded results."
        exit 1
