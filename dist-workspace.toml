[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# release.yml is hand-patched (npm-publish node-version 20.x -> 24.x, since
# cargo-dist 0.32 hardcodes 20.x with no config knob). Tell `dist plan` not to
# fail its CI-freshness check on that deliberate drift. Re-apply the node patch
# after any `dist generate`.
allow-dirty = ["ci"]
# Emit Sigstore build-provenance attestations for every release artifact
# (GitHub `actions/attest-build-provenance`), so downloads can be verified with
# `gh attestation verify`. Adds `id-token`/`attestations` write scopes to the
# generated release workflow.
github-attestations = true
# The installers to generate for each app. `shell` covers macOS/Linux
# (`curl … | sh`); `powershell` gives Windows a package-manager-free
# `irm … | iex` one-liner for the x86_64-pc-windows-msvc build below.
installers = ["shell", "powershell", "npm"]
# Package Unix artifacts as `.tar.gz`, not dist's default `.tar.xz`. The shell
# and npm installers untar the release via the system `tar`, which needs the
# separate `xz` binary for `.tar.xz` — absent from minimal images (debian-slim,
# distroless, many CI/Docker containers), where `npm i -g @tmonier/argot` then
# dies with `tar: xz: Cannot exec`. gzip is built into tar/libarchive
# everywhere, so `.tar.gz` installs with zero extra system deps. Costs a few MB
# of compression vs xz; buys install reliability on any base image. dist has no
# per-installer format knob, so this applies to every Unix artifact.
unix-archive = ".tar.gz"
# Windows: link the DYNAMIC CRT (/MD). cargo-dist defaults to the static CRT.
# This was forced by llama.cpp's cmake-built objects, which referenced dynamic
# UCRT imports (__imp_fopen, …) and broke the first Windows release carrying the
# embedder (v0.2.56/57, LNK2019). llama.cpp is gone and that cause with it, so a
# static CRT is testable again — re-evaluate deliberately rather than flipping it
# blind. The UCRT ships with Windows 10+, so /MD remains safe meanwhile.
msvc-crt-static = false
# Publish the npm installer as @tmonier/argot (preserves `npm i -g @tmonier/argot`)
npm-scope = "@tmonier"
# NOTE: cargo-dist 0.32 hardcodes the npm-publish job's Node to 20.x (EOL Apr
# 2026) with no config override. release.yml is hand-patched to `node-version:
# '24.x'` — re-apply that edit after every `dist generate` until dist ships a
# newer default or a knob for it.
# Push the npm installer to the registry (uses the NPM_TOKEN secret)
publish-jobs = ["npm"]
# Target platforms to build apps for (Rust target-triple syntax).
# apple-darwin x2 (Apple Silicon + Intel Macs) · linux-gnu x2 (x86_64 + ARM:
# Graviton CI, Raspberry Pi, ARM containers).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Shipped binaries self-update via `argot update`; dev/CI builds skip the
# feature (and its HTTP dependency tree) entirely. `semantic` is the
# code-embedding layer — pure Rust, with ~17.5 MB of model weights compiled into
# the binary (hence 36.5 → 48.5 MB). See the semantic layer notes in CLAUDE.md. `arch` is the
# architecture-graph layer (module-dependency-boundary `layering` findings) —
# pure-Rust, on in shipped binaries: 97% real recall / 0% false-positives across
# 23 corpora / 11 languages (docs/research/evidence/architecture-graph-foreignness.md).
# `integrity` is the test-integrity layer (test-gaming findings `test-deleted` /
# `test-disabled` / `test-weakened`) — pure-Rust, on in shipped binaries; numbers
# in docs/research/evidence/test-integrity-*.md.
features = ["self-update", "semantic", "arch", "integrity", "script"]




# Build aarch64-linux on GitHub's NATIVE ARM runner instead of cross-compiling:
# libgit2 and the tree-sitter grammars are C and compile natively there, with no
# cross toolchain. The other four targets already build on their own native
# runners (macOS x2, x86_64-linux, windows-msvc).
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# Publish a CycloneDX SBOM as a release artifact. dist builds it on the global
# job, then checksums, attests, and attaches it like any other artifact. The
# generator is a jq transform of `cargo metadata` (scripts/gen-sbom.jq) — no
# Python, no SBOM tool to install; jq already drives the release pipeline.
[[dist.extra-artifacts]]
artifacts = ["bom.cdx.json"]
build = ["bash", "-c", "cargo metadata --all-features --format-version 1 | jq -f scripts/gen-sbom.jq > bom.cdx.json"]
