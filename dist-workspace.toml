[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# Publish the npm installer as @tmonier/argot (preserves `npm i -g @tmonier/argot`)
npm-scope = "@tmonier"
# Push the npm installer to the registry (uses the NPM_TOKEN secret)
publish-jobs = ["npm"]
# Homebrew tap: cargo-dist builds `argot.rb` and attaches it to every release.
# Auto-publishing the formula to the tap repo is intentionally left OFF until the
# tap exists — to enable it, create the `get-tmonier/homebrew-tap` repo, add a
# `HOMEBREW_TAP_TOKEN` secret with push access, add "homebrew" to publish-jobs
# above, and re-run `dist generate`. Then `brew install get-tmonier/homebrew-tap/argot`.
tap = "get-tmonier/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax).
# apple-darwin x2 (Apple Silicon + Intel Macs) · linux-gnu x2 (x86_64 + ARM:
# Graviton CI, Raspberry Pi, ARM containers).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Shipped binaries self-update via `argot update`; dev/CI builds skip the
# feature (and its HTTP dependency tree) entirely.
features = ["self-update"]
