[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `shell` covers macOS/Linux
# (`curl … | sh`); `powershell` gives Windows a package-manager-free
# `irm … | iex` one-liner for the x86_64-pc-windows-msvc build below.
installers = ["shell", "powershell", "npm"]
# Publish the npm installer as @tmonier/argot (preserves `npm i -g @tmonier/argot`)
npm-scope = "@tmonier"
# Push the npm installer to the registry (uses the NPM_TOKEN secret)
publish-jobs = ["npm"]
# Target platforms to build apps for (Rust target-triple syntax).
# apple-darwin x2 (Apple Silicon + Intel Macs) · linux-gnu x2 (x86_64 + ARM:
# Graviton CI, Raspberry Pi, ARM containers).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Shipped binaries self-update via `argot update`; dev/CI builds skip the
# feature (and its HTTP dependency tree) entirely.
features = ["self-update"]
