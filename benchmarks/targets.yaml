  # Multi-language monorepo (Python in `python_modules/`, TypeScript in
  # `js_modules/app-oss/src/`). Per-language calibration validates against
  # this corpus; see `.scratch/multi-language-bench/PRD.md`. PRs picked
  # for diversity across the monorepo halves: two touch the JS surface
  # (#33777 UI markdown, #33745 ui-core kinds tag), three touch the
  # Python surface (#33740 core config, #33735 dagster-postgres, #33491
  # dagster-aws).
  - name: dagster
    url: https://github.com/dagster-io/dagster
