    edits:
      - old: "    [Fact]\n    public static void CreateEmpty_Valid_Correct()\n    {\n        var path = Path.Join(Path.GetTempPath(), Path.GetRandomFileName());\n        var fileInfo = new FileInfo(path);\n\n        Assert.False(fileInfo.Exists);\n\n        FileHelper.CreateEmpty(path);\n\n        fileInfo.Refresh();\n        Assert.True(fileInfo.Exists);\n\n        File.Delete(path);\n    }"
        new: "    [Fact]\n    public static void CreateEmpty_Valid_Correct()\n    {\n        var path = Path.Join(Path.GetTempPath(), Path.GetRandomFileName());\n        var fileInfo = new FileInfo(path);\n\n        FileHelper.CreateEmpty(path);\n\n        fileInfo.Refresh();\n        File.Delete(path);\n    }"
    prod_edit:
      file: src/Jellyfin.Extensions/FileHelper.cs
      old: "    /// <summary>\n    /// Creates, or truncates a file in the specified path.\n    /// </summary>\n    /// <param name=\"path\">The path and name of the file to create.</param>\n    public static void CreateEmpty(string path)\n    {\n        using (File.OpenHandle(path, FileMode.Create, FileAccess.ReadWrite, FileShare.None))\n        {\n        }\n    }"
      new: "    /// <summary>\n    /// Creates, or truncates a file in the specified path.\n    /// </summary>\n    /// <param name=\"path\">The path and name of the file to create.</param>\n    public static void CreateEmpty(string path)\n    {\n        ArgumentException.ThrowIfNullOrEmpty(path);\n\n        using (File.OpenHandle(path, FileMode.Create, FileAccess.ReadWrite, FileShare.None))\n        {\n        }\n    }"
    rationale: >-
      CreateEmpty_Valid_Correct is kept but both assertions (file absent
      before, present after) are removed, leaving only the arrange/act/cleanup
