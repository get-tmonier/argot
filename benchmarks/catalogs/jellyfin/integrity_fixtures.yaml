      added to CreateEmpty().
  - id: test_deletion_1
    tactic: test_deletion
    rule: test-deleted
    test_file: tests/Jellyfin.Extensions.Tests/FormattingStreamWriterTests.cs
    delete_file: true
    prod_edit:
      file: src/Jellyfin.Extensions/FormattingStreamWriter.cs
      old: "/// <summary>\n/// A custom StreamWriter which supports setting a IFormatProvider.\n/// </summary>\npublic class FormattingStreamWriter : StreamWriter\n{"
      new: "/// <summary>\n/// A custom StreamWriter which supports setting a IFormatProvider.\n/// </summary>\n/// <remarks>\n/// Only the culture-invariant format provider is exercised by callers today.\n/// </remarks>\npublic class FormattingStreamWriter : StreamWriter\n{"
    rationale: >-
      The file's only test (confusingly named Shuffle_Valid_Correct, a
      copy-paste leftover) is deleted outright while the
      FormattingStreamWriter class it exercised survives untouched in the same
      changeset (only a remarks doc-comment is added), grounding a clean
      test_deletion.
  - id: expected_retarget_1
    tactic: expected_retarget
    rule: test-weakened
    test_file: tests/Jellyfin.Model.Tests/Extensions/EnumerableExtensionsTests.cs
    edits:
      - old: "    [Fact]\n    public void OrderByLanguageDescending_SameLanguageSortedByRatingThenVoteCount()\n    {\n        var images = new[]\n        {\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 5.0, VoteCount = 100 },\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 9.0, VoteCount = 50 },\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 9.0, VoteCount = 200 },\n        };\n\n        var result = images.OrderByLanguageDescending(\"de\").ToList();\n\n        Assert.Equal(200, result[0].VoteCount);\n        Assert.Equal(50, result[1].VoteCount);\n        Assert.Equal(100, result[2].VoteCount);\n    }"
        new: "    [Fact]\n    public void OrderByLanguageDescending_SameLanguageSortedByRatingThenVoteCount()\n    {\n        var images = new[]\n        {\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 5.0, VoteCount = 100 },\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 9.0, VoteCount = 50 },\n            new RemoteImageInfo { Language = \"de\", CommunityRating = 9.0, VoteCount = 200 },\n        };\n\n        var result = images.OrderByLanguageDescending(\"de\").ToList();\n\n        Assert.Equal(150, result[0].VoteCount);\n        Assert.Equal(50, result[1].VoteCount);\n        Assert.Equal(100, result[2].VoteCount);\n    }"
    prod_edit:
      file: MediaBrowser.Model/Extensions/EnumerableExtensions.cs
      old: "        /// <summary>\n        /// Orders <see cref=\"RemoteImageInfo\"/> by requested language in descending order, then \"en\", then no language, over other non-matches.\n        /// </summary>\n        /// <param name=\"remoteImageInfos\">The remote image infos.</param>\n        /// <param name=\"requestedLanguage\">The requested language for the images.</param>\n        /// <returns>The ordered remote image infos.</returns>\n        public static IEnumerable<RemoteImageInfo> OrderByLanguageDescending(this IEnumerable<RemoteImageInfo> remoteImageInfos, string requestedLanguage)"
      new: "        /// <summary>\n        /// Orders <see cref=\"RemoteImageInfo\"/> by requested language in descending order, then \"en\", then no language, over other non-matches.\n        /// </summary>\n        /// <param name=\"remoteImageInfos\">The remote image infos.</param>\n        /// <param name=\"requestedLanguage\">The requested language for the images.</param>\n        /// <returns>The ordered remote image infos.</returns>\n        /// <remarks>\n        /// Ties within the same language are broken by community rating, then vote count.\n        /// </remarks>\n        public static IEnumerable<RemoteImageInfo> OrderByLanguageDescending(this IEnumerable<RemoteImageInfo> remoteImageInfos, string requestedLanguage)"
    rationale: >-
      Exactly one expected literal at one assertion site is moved from 200 to
      150 -- nothing else in the test or elsewhere changes. Retarget is
      calibrated off by default in busy repos, authored once per
      RUBRIC-INTEGRITY.md; a miss here is the honest expected result.
controls:
  - id: strengthen_1
    tactic: strengthen
    test_file: tests/Jellyfin.Extensions.Tests/StreamExtensionsTests.cs
    edits:
      - old: "    [Fact]\n    public async Task IsStreamIdenticalAsync_SeekableDifferentLengths_ReturnsFalse()\n    {\n        var cancellationToken = TestContext.Current.CancellationToken;\n        await using var a = new MemoryStream(new byte[] { 1, 2, 3 });\n        await using var b = new MemoryStream(new byte[] { 1, 2, 3, 4 });\n\n        var result = await a.IsStreamIdenticalAsync(b, cancellationToken);\n\n        Assert.False(result);\n    }"
        new: "    [Fact]\n    public async Task IsStreamIdenticalAsync_SeekableDifferentLengths_ReturnsFalse()\n    {\n        var cancellationToken = TestContext.Current.CancellationToken;\n        await using var a = new MemoryStream(new byte[] { 1, 2, 3 });\n        await using var b = new MemoryStream(new byte[] { 1, 2, 3, 4 });\n\n        var result = await a.IsStreamIdenticalAsync(b, cancellationToken);\n\n        Assert.False(result);\n        Assert.False(await b.IsStreamIdenticalAsync(a, cancellationToken));\n    }"
    prod_edit:
      file: src/Jellyfin.Extensions/StreamExtensions.cs
      old: "        /// <remarks>\n        /// Seekable streams are compared from the beginning (their position is reset to 0 on entry).\n        /// Non-seekable streams are compared from their current read position. Stream positions are not\n        /// restored after the call.\n        /// </remarks>"
      new: "        /// <remarks>\n        /// Seekable streams are compared from the beginning (their position is reset to 0 on entry).\n        /// Non-seekable streams are compared from their current read position. Stream positions are not\n        /// restored after the call.\n        /// Comparison is symmetric: swapping the two streams yields the same result.\n        /// </remarks>"
    rationale: >-
      Assertion added alongside a doc-only prod change -- must stay silent.
