  - id: laravel_churn_move_1
    tactic: churn_move
    test_file: tests/Support/SupportOptionalTest.php
    edits:
      - old: |2-
              public function testIssetExistItemOnArray()
              {
                  $targetArr = [
                      'item' => '',
                  ];

                  $optional = new Optional($targetArr);

                  $this->assertTrue(isset($optional['item']));
                  $this->assertTrue(isset($optional->item));
              }
        new: |2-
              public function testIssetExistItemOnArray()
              {
                  $targetArr = [
                      'item' => '',
                  ];

                  $optional = new Optional($targetArr);

                  $this->assertTrue(isset($optional->item));
              }
      - old: |2-
              public function testGetExistItemOnArray()
              {
                  $expected = 'test';

                  $targetArr = [
                      'item' => $expected,
                  ];

                  $optional = new Optional($targetArr);

                  $this->assertEquals($expected, $optional['item']);
              }
        new: |2-
              public function testGetExistItemOnArray()
              {
                  $expected = 'test';

                  $targetArr = [
                      'item' => $expected,
                  ];

                  $optional = new Optional($targetArr);

                  $this->assertEquals($expected, $optional['item']);
                  $this->assertTrue(isset($optional['item']));
              }
    prod_edit:
      file: src/Illuminate/Support/Optional.php
      old: |2-
            public function offsetExists($offset): bool
            {
                return Arr::accessible($this->value) && Arr::exists($this->value, $offset);
            }
      new: |2-
            public function offsetExists($offset): bool
            {
                if ($this->value === null) {
                    return false;
                }

                return Arr::accessible($this->value) && Arr::exists($this->value, $offset);
            }
    rationale: >-
      The isset($optional['item']) check moves from testIssetExistItemOnArray to
      testGetExistItemOnArray (net assertion count unchanged across the file,
      exact same site text) alongside a small null-guard — must stay silent.
