  - id: churn_move_1
    tactic: churn_move
    test_file: spec/rubocop/path_util_spec.rb
    edits:
      - old: |-
          it 'does not match file in a subdirectory' do
                expect(described_class).not_to be_match_path('file', 'dir/files')
                expect(described_class).not_to be_match_path('dir', 'dir/file')
              end
        new: |-
          it 'does not match file in a subdirectory' do
                expect(described_class).not_to be_match_path('file', 'dir/files')
              end
      - old: |-
          it 'matches dir/** for hidden file' do
                expect(described_class).to be_match_path('dir/**', 'dir/.hidden_file')
              end
        new: |-
          it 'matches dir/** for hidden file' do
                expect(described_class).to be_match_path('dir/**', 'dir/.hidden_file')
                expect(described_class).not_to be_match_path('dir', 'dir/file')
              end
    prod_edit:
      file: lib/rubocop/path_util.rb
      old: |-
        def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
      new: |-
        # Returns true if the given URI points to a remote resource.
            def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
    rationale: >-
      One assertion moves from 'does not match file in a subdirectory' into
      'matches dir/** for hidden file'; the changeset-wide occurrence count of
      that not_to-be_match_path site shape is unchanged, so nothing net-vanished.
