                expect(described_class).to be_absolute('/Users/foo')
              end
        new: |-
          it 'returns a truthy value for a path beginning with slash' do
                expect(true).to eq(true)
              end
    prod_edit:
      file: lib/rubocop/path_util.rb
      old: |-
        def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
      new: |-
        # Returns true if the given URI points to a remote resource.
            def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
    rationale: >-
      A red predicate-matcher assertion swapped for a literal-vs-literal
      comparison that can never fail.
  - id: expected_retarget_1
    tactic: expected_retarget
    rule: test-weakened
    test_file: spec/rubocop/path_util_spec.rb
    edits:
      - old: |-
          it 'builds paths relative to PWD by default as a stop-gap' do
                relative = File.join(Dir.pwd, 'relative')
                expect(described_class.relative_path(relative)).to eq('relative')
              end
        new: |-
          it 'builds paths relative to PWD by default as a stop-gap' do
                relative = File.join(Dir.pwd, 'relative')
                expect(described_class.relative_path(relative)).to eq('relative/')
              end
    prod_edit:
      file: lib/rubocop/path_util.rb
      old: |-
        def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
      new: |-
        # Returns true if the given URI points to a remote resource.
            def remote_file?(uri)
              uri.start_with?('http://', 'https://')
            end
    rationale: >-
      One expected literal moved at one site, nothing else added anywhere in the
      changeset. Retarget is gated off by default in busy repos, so a miss here is
      the expected, honest result.
  - id: comparison_widening_1
    tactic: comparison_widening
    rule: test-weakened
    test_file: spec/rubocop/string_interpreter_spec.rb
    edits:
      - old: |-
          it 'handles hex' do
                expect(described_class.interpret('\\\\x68')).to eq('\x68')
              end
        new: |-
          it 'handles hex' do
                expect(described_class.interpret('\\\\x68')).not_to be_nil
              end
    prod_edit:
      file: lib/rubocop/string_interpreter.rb
      old: |-
        def interpret_octal(escape)
                [escape[1..].to_i(8)].pack('C')
              end
      new: |-
        # Interpret a backslash-prefixed octal byte escape.
              def interpret_octal(escape)
                [escape[1..].to_i(8)].pack('C')
              end
    rationale: >-
      The exact hex-decode check is downgraded to existence while the other three
      `handles *` examples in the file stay byte-identical.
