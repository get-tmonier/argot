  - id: body_gutting_1
    tactic: body_gutting
    rule: test-disabled
    test_file: packages/common/tests/queue.test.ts
    edits:
      - old: |-
          it("should reject a job if it throws, and not affect other jobs", async () => {
              const queue = new Queue();

              const err = new Error("B");

              queue.push(createJobFactory("A", 50));
              const p2 = queue.push(createJobFactory(err));
              const p3 = queue.push(createJobFactory("C"));

              const p2err = p2.catch((err) => err);

              await p3;

              expect(await p2err).toBe(err);

              expect(calls).toEqual(["A", "C"]);
            });
        new: |-
          it("should reject a job if it throws, and not affect other jobs", async () => {
              const queue = new Queue();

              const err = new Error("B");

              queue.push(createJobFactory("A", 50));
              const p2 = queue.push(createJobFactory(err));
              const p3 = queue.push(createJobFactory("C"));

              const p2err = p2.catch((err) => err);

              await p3;
            });
    prod_edit:
      file: packages/common/src/queue.ts
      old: |-
          push<TValue, TArgs extends unknown[]>(
              jobFactory: Job<TValue, TArgs>,
              ...args: TArgs
            ): Promise<TValue> {
              const promise = resolvablePromise<TValue>();
              this.jobs.push({ jobFactory, promise, args });
      new: |-
          push<TValue, TArgs extends unknown[]>(
              jobFactory: Job<TValue, TArgs>,
              ...args: TArgs
            ): Promise<TValue> {
              const promise = resolvablePromise<TValue>();
              const job: QueueJob<TValue, TArgs> = { jobFactory, promise, args };
              this.jobs.push(job);
    rationale: >-
      The jobs are still enqueued (setup kept), but both assertions
      observing rejection propagation are gutted so the test passes
      vacuously regardless of Queue's actual error-handling behaviour.
