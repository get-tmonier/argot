# Architecture-graph violation fixtures for gh-cli (Go). Each `import_line` added
# to `host_file` creates the internal edge (source layer -> target layer). Violations
# cross a boundary the repo's learned layering treats as foreign; controls respect
# the established direction and must not fire.
#
# Layer = first path component under the module root `github.com/cli/cli/v2/`.
# Topology at HEAD (from `git grep -l '"github.com/cli/cli/v2/<layer>"'` over the
# whole tree, scoped per source layer):
#   - `api` (GitHub REST/GraphQL client) has the widest fan-in: 208 files import it,
#     it imports nothing internal (api/client.go pulls in only the external
#     `ghAPI`/`ghauth` packages) — a pure transport leaf that's heavily consumed.
#   - `git` (local git command wrapper) is the parallel transport leaf: 81-file
#     fan-in, imports only internal/ghinstance internally. api and git are always
#     wired side by side by their callers (context, pkg/cmd/*) — neither has ever
#     imported the other.
#   - `context` (current repo/remote resolution) sits above both: context.go imports
#     api and internal/ghrepo, and context/remote.go imports git — 34-file fan-in,
#     mostly from pkg/cmd/*.
#   - `internal` is the broad, heavily-imported (495-file) services layer
#     (config/ghrepo/telemetry/agents/...); individual subpackages like
#     internal/agents/detect.go are self-contained (stdlib only).
#   - `utils` is the smallest leaf (utils/utils.go: IsDebugEnabled + TerminalSize,
#     stdlib + golang.org/x/term only), consumed by 7 files spread across api,
#     internal, and pkg/cmd/*.
#   - `test` (test/helpers.go: CmdOut/OutputStub/ExpectLines, stdlib-only, explicitly
#     "// TODO copypasta from command package") is pure test-double scaffolding —
#     all 23 current consumers are `_test.go` files.
#   - `cmd` holds the entrypoints: cmd/gh/main.go is a two-line shim into
#     internal/ghcmd.Main(); cmd/gen-docs/main.go is a narrow doc generator whose
#     only imports are internal/{config,docs,gh,ghrepo,telemetry} and
#     pkg/{cmd/root,cmdutil,extensions,iostreams} — it walks the cobra command tree
#     and writes man/markdown pages, nothing more.
#   - `acceptance` (acceptance/acceptance_test.go) is the top-level E2E suite; it
#     runs the full CLI in-process (`ghMain()`/`TestMain`) via internal/ghcmd.
#
# Selection method: candidates came from a resolver-verified 0-usage edge menu
# (`/tmp/arch-fix/candidates-gh-cli.md`, each import_line confirmed to create the
# stated src->tgt edge with no prior usage). Two menu rows targeted a bare
# `internal` or `pkg` import path with no `.go` files directly under that
# directory (only subpackages) — those import lines do not compile as valid Go
# and were excluded as unrealistic. Entries below were then picked by
# architectural realism, not by `kind`: violations mix caught reversal/
# transitive_reversal/sink_out edges with two `forward`-kind edges that are still
# questionable for their specific host file (so the recall measurement isn't
# circular); controls are `forward`-kind edges that are genuinely legitimate.

violations:
  # ---- reversals / transitive reversal (an attested B->A edge exists, so A->B reverses it) ----
  - host_file: "utils/utils.go"
    source_layer: "utils"
    import_line: "import \"github.com/cli/cli/v2/api\""
    target_layer: "api"
    kind: "reversal"
    rationale: >-
      utils.go is gh-cli's smallest leaf: two functions (IsDebugEnabled,
      TerminalSize), stdlib + golang.org/x/term only. Importing the 208-file
      GitHub API client here means a generic debug/terminal helper reaching up
      into GraphQL/REST plumbing. The reverse is attested: api/http_client.go
      already imports utils (one of utils's 7 consumers), so utils->api reverses
      that established api->utils direction.

  - host_file: "api/client.go"
    source_layer: "api"
    import_line: "import \"github.com/cli/cli/v2/git\""
    target_layer: "git"
    kind: "transitive_reversal"
    rationale: >-
      api/client.go is the GitHub HTTP/GraphQL transport (its only imports are
      the external ghAPI/ghauth packages — zero internal deps). git/client.go is
      the parallel local-git transport (81-file fan-in). Every caller that needs
      both (context/remote.go, pkg/cmd/*) wires them side by side rather than
      chaining one through the other; neither api nor git has ever imported the
      other. api reaching into git would collapse that separation and pull local
      git-command execution into what is meant to be a pure network client.

  - host_file: "git/client.go"
    source_layer: "git"
    import_line: "import \"github.com/cli/cli/v2/context\""
    target_layer: "context"
    kind: "reversal"
    rationale: >-
      context/remote.go already imports git to resolve remotes (context->git,
      part of context's 34-file consumption). git/client.go importing context
      back would close that loop — the local-git transport reaching up into the
      repo-context resolver that is itself built on top of git.

  - host_file: "internal/agents/detect.go"
    source_layer: "internal"
    import_line: "import \"github.com/cli/cli/v2/context\""
    target_layer: "context"
    kind: "reversal"
    rationale: >-
      context.go already imports internal/ghrepo (context->internal, attested).
      internal/agents/detect.go — a small, self-contained coding-agent sniffer
      (stdlib only: fmt/os/regexp/strings) — importing context to resolve the
      current repo would reverse that established context->internal direction
      and drag repo-resolution into an unrelated agent-detection helper.

  # ---- sink_out (`test` is a near-sink: 23 consumers, all _test.go, fan_out=0) ----
  - host_file: "context/context.go"
    source_layer: "context"
    import_line: "import \"github.com/cli/cli/v2/test\""
    target_layer: "test"
    kind: "sink_out"
    rationale: >-
      test/helpers.go is pure test-double scaffolding (CmdOut/OutputStub/
      ExpectLines, stdlib-only, explicitly commented "// TODO copypasta from
      command package") consumed by 23 files, every one of them `_test.go`.
      context.go is production code; importing test would wire mock types into
      the real repo-context resolver — the classic "reached for the nearby test
      helper" mistake, and test leaving its sink position (consumed-only) is the
      signal.

  - host_file: "api/client.go"
    source_layer: "api"
    import_line: "import \"github.com/cli/cli/v2/test\""
    target_layer: "test"
    kind: "sink_out"
    rationale: >-
      Same test-only sink as above, from the other transport leaf: api/client.go
      is the production GraphQL/REST client. Pulling in test's CmdOut/OutputStub
      mock types here would mean production request handling depends on
      scaffolding meant only for `_test.go` files — test has zero legitimate
      production consumers.

  # ---- forward but still questionable (honesty check: not caught by direction alone) ----
  - host_file: "cmd/gen-docs/main.go"
    source_layer: "cmd"
    import_line: "import \"github.com/cli/cli/v2/git\""
    target_layer: "git"
    kind: "forward"
    rationale: >-
      gen-docs is a narrow, single-purpose doc-generation entrypoint — its only
      imports are internal/{config,docs,gh,ghrepo,telemetry} and pkg/{cmd/root,
      cmdutil,extensions,iostreams} for walking the cobra command tree and
      writing man/markdown pages; it never resolves a repo or runs git. cmd sits
      at the top of the graph so cmd->git is directionally "forward" (not caught
      by the reversal/sink_out signal), but there is no doc-generation reason to
      shell out to git — a layer-skip an LLM could introduce (e.g. "let me
      git-blame this command file for an example") that the structural direction
      check alone will miss. Included to keep the recall measurement honest.

  - host_file: "cmd/gen-docs/main.go"
    source_layer: "cmd"
    import_line: "import \"github.com/cli/cli/v2/context\""
    target_layer: "context"
    kind: "forward"
    rationale: >-
      Same narrow-scope argument: gen-docs has no current-repo/remote to
      resolve — it introspects the static command tree, not a live checkout.
      Importing context here is forward-direction and uncaught by the layering
      signal, yet it is still an architecturally unnecessary edge for this
      specific file: the doc generator reaching into repo-context resolution it
      will never use.

controls:
  - host_file: "acceptance/acceptance_test.go"
    source_layer: "acceptance"
    import_line: "import \"github.com/cli/cli/v2/api\""
    target_layer: "api"
    rationale: >-
      acceptance tests already run the full CLI in-process (ghMain()/TestMain)
      and commonly need a side channel to seed or clean up GitHub-side fixtures
      (create/delete a throwaway PR or issue) independent of the command path
      under test. api is forward-consumed by 208 files across the repo and
      acceptance sits above it in the graph, so a direct api import for test
      setup/teardown follows the established top-consumes-transport direction —
      must not fire.

  - host_file: "acceptance/acceptance_test.go"
    source_layer: "acceptance"
    import_line: "import \"github.com/cli/cli/v2/git\""
    target_layer: "git"
    rationale: >-
      E2E acceptance tests routinely need to set up or verify local repo state
      (init a scratch repo, confirm a commit landed, inspect a branch) around
      the CLI invocation under test. git already has an 81-file fan-in and
      acceptance is a top consumer layer; using the git wrapper for local-repo
      scaffolding in an E2E test is legitimate test infrastructure, not a
      layering mistake.

  - host_file: "acceptance/acceptance_test.go"
    source_layer: "acceptance"
    import_line: "import \"github.com/cli/cli/v2/test\""
    target_layer: "test"
    rationale: >-
      test/helpers.go (CmdOut, OutputStub, ExpectLines) exists purely to be
      imported by test files — its 23 current consumers are all `_test.go`.
      acceptance_test.go doing the same is the textbook intended use of a
      shared test-helper package; the detector must stay quiet on the direction
      it was built for.

  - host_file: "acceptance/acceptance_test.go"
    source_layer: "acceptance"
    import_line: "import \"github.com/cli/cli/v2/utils\""
    target_layer: "utils"
    rationale: >-
      utils (IsDebugEnabled/TerminalSize) is already consumed from api,
      internal, and three pkg/cmd/* packages (7 files total) as a generic
      low-level helper. An E2E test reading GH_DEBUG or terminal size to
      configure how it captures and asserts on CLI output is normal use of that
      shared leaf utility — the same shape as its existing callers — and must
      not fire.
