            template.replacen("%s", &shell_quote(replacement), 1)
        }
      new: |-
        /// Substitute the first `%s` in a $LESSOPEN/$LESSCLOSE template with a quoted value.
        fn shell_substitute(template: &str, replacement: &str) -> String {
            template.replacen("%s", &shell_quote(replacement), 1)
        }

