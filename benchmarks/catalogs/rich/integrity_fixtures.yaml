- id: legit_deletion_1
  tactic: legit_deletion
  test_file: tests/test_pick.py
  edits:
  - old: |-
      def test_pick_bool():
          assert pick_bool(False) == False
          assert pick_bool(True) == True
          assert pick_bool(None) == False
          assert pick_bool(False, True) == False
          assert pick_bool(None, True) == True
          assert pick_bool(True, None) == True
          assert pick_bool(False, None) == False
          assert pick_bool(None, None) == False
          assert pick_bool(None, None, False, True) == False
          assert pick_bool(None, None, True, False) == True
    new: ""
  prod_edit:
    file: rich/_pick.py
    old: |-
      def pick_bool(*values: Optional[bool]) -> bool:
          """Pick the first non-none bool or return the last value.

          Args:
              *values (bool): Any number of boolean or None values.

          Returns:
              bool: First non-none boolean.
          """
          assert values, "1 or more values required"
          for value in values:
              if value is not None:
                  return value
          return bool(value)
    new: ""
  rationale: The test is deleted together with the production symbol it exercised (pick_bool is removed
    from rich/_pick.py in the same changeset) — the feature and its coverage leave together, the legitimate
    shape test_deletion_1 is not.
