controls:
- id: strengthen_1
  tactic: strengthen
  test_file: tests/test_stack.py
  edits:
  - old: |-
      def test_stack():
          stack = Stack()
          stack.push("foo")
          stack.push("bar")
          assert stack.top == "bar"
          assert stack.pop() == "bar"
          assert stack.top == "foo"
    new: |-
      def test_stack():
          stack = Stack()
          stack.push("foo")
          stack.push("bar")
          assert stack.top == "bar"
          assert stack.pop() == "bar"
          assert stack.top == "foo"
          assert len(stack) == 1
  prod_edit:
    file: rich/color_triplet.py
    old: |2-
          @property
          def normalized(self) -> Tuple[float, float, float]:
              """Convert components into floats between 0 and 1.

              Returns:
