# Architecture-graph violation fixtures for saleor. Each `import_line` added to
# `host_file` creates the internal edge (source layer -> target layer). Violations
# cross a boundary the repo never crosses; controls respect the established direction.
#
# Layer = first path component under the package root `saleor/`.
#
# METHODOLOGY (v2 — replaces the prior git-grep-authored set): the original
# fixtures here were authored via text `git grep` and were mostly INVALID —
# many of the claimed 0-usage edges already existed as real relative-import
# edges the grep missed (e.g. `from . import X` / `from ..core import X`
# inside the target package itself). This file is instead authored from a
# resolver-VERIFIED candidate menu: an AST-based import resolver walked the
# real saleor/.repo dependency graph (all import forms, including relative
# imports) and classified every layer-pair edge that is genuinely 0-usage at
# HEAD as one of:
#   - reversal:            the reverse edge (target_layer -> source_layer) is
#                           directly attested elsewhere in the graph.
#   - transitive_reversal: the reverse dependency holds only via the
#                           transitive closure of the import graph (a
#                           multi-hop path), not a single direct edge.
#   - forward:              a genuinely 0-usage edge that follows an already
#                           established direction (an entry/composition-root
#                           layer reaching into a domain layer) — legitimate
#                           growth, must NOT be flagged.
# Each row below reproduces its host_file + import_line EXACTLY from that
# verified menu; nothing here is hand-invented. `ArgotFixture` is the
# resolver's neutral placeholder import target — the edge is verified at the
# module-resolution level (does this import statement wire source_layer to
# target_layer), independent of which real symbol would eventually be pulled
# in by a hand-written LLM edit.
#
# Pattern behind most violations below: saleor has a family of narrow
# leaf/utility apps (seo, translations, warehouse, invoice, attribute,
# shipping, tax, channel, thumbnail, site, schedulers, permission, ...) that
# are *consumed* by the domain/app layers (core, product, order, account,
# app, webhook, discount) — e.g. product models mix in SEO/translation
# helpers, domain apps register their periodic jobs with schedulers, core's
# access-control helpers reach for permission enums. The resolver confirms
# those consumer -> leaf edges are the attested direction; a leaf layer
# reaching back UP into the layer that consumes it (or into a layer that
# transitively depends on it) is exactly the kind of backwards mistake an
# LLM agent introduces when it scaffolds a new integration without noticing
# which side already owns the dependency.

violations:
  # ---- reversal: direct attested target_layer -> source_layer edge exists ----
  - host_file: "saleor/permission/__init__.py"
    source_layer: "permission"
    import_line: "from saleor.core import ArgotFixture"
    target_layer: "core"
    kind: "reversal"
    rationale: >-
      permission is a leaf access-control layer: core's generic view/serializer
      helpers reach for permission enums to run access checks (core -> permission
      is the attested direction). Resolver-verified permission -> core is 0-usage
      at HEAD, so a permission module importing core here reverses that — the
      access-control leaf has no business reaching down into the sink utility
      layer that consumes it.

  - host_file: "saleor/invoice/__init__.py"
    source_layer: "invoice"
    import_line: "from saleor.webhook import ArgotFixture"
    target_layer: "webhook"
    kind: "reversal"
    rationale: >-
      invoice is a narrow leaf app (PDF/invoice generation); webhook dispatch
      code reaches into invoice to fire "invoice created/sent" events (webhook ->
      invoice attested). Resolver-verified invoice -> webhook is 0-usage, so an
      invoice module reaching up into the webhook layer that consumes it reverses
      the established direction.

  - host_file: "saleor/attribute/__init__.py"
    source_layer: "attribute"
    import_line: "from saleor.webhook import ArgotFixture"
    target_layer: "webhook"
    kind: "reversal"
    rationale: >-
      attribute defines product-attribute models consumed by the webhook
      payload/event layer when serializing attribute-change events (webhook ->
      attribute attested). Resolver-verified attribute -> webhook is 0-usage;
      attribute reaching up into webhook inverts who depends on whom.

  - host_file: "saleor/tax/__init__.py"
    source_layer: "tax"
    import_line: "from saleor.product import ArgotFixture"
    target_layer: "product"
    kind: "reversal"
    rationale: >-
      tax is a calculation leaf; product models pull tax classes/rates into
      pricing logic (product -> tax attested). Resolver-verified tax -> product
      is 0-usage, so a tax module reaching up into the product layer that
      consumes it reverses the established direction.

  - host_file: "saleor/thumbnail/__init__.py"
    source_layer: "thumbnail"
    import_line: "from saleor.order import ArgotFixture"
    target_layer: "order"
    kind: "reversal"
    rationale: >-
      thumbnail is a generic image-resizing leaf; order-related media (e.g.
      order document previews) call into thumbnail generation (order ->
      thumbnail attested). Resolver-verified thumbnail -> order is 0-usage, so
      thumbnail reaching up into order reverses that consumer relationship.

  # ---- transitive_reversal: reverse dependency holds via the graph closure ----
  - host_file: "saleor/translations/__init__.py"
    source_layer: "translations"
    import_line: "from saleor.core import ArgotFixture"
    target_layer: "core"
    kind: "transitive_reversal"
    rationale: >-
      translations is a leaf i18n mixin consumed broadly across the domain
      layers (product, page, menu, ...), and those consumers feed into core
      transitively — so core is reachable from translations only in the
      consumer -> core direction, never directly. Resolver-verified
      translations -> core is 0-usage; translations reaching directly into core
      cuts across that transitive chain instead of being consumed through it.

  - host_file: "saleor/warehouse/__init__.py"
    source_layer: "warehouse"
    import_line: "from saleor.permission import ArgotFixture"
    target_layer: "permission"
    kind: "transitive_reversal"
    rationale: >-
      warehouse (stock/reservation models) is consumed by permission-gated
      views that transitively depend on it for stock-level checks, so
      permission is only reachable from warehouse via that consumer chain, not
      directly. Resolver-verified warehouse -> permission is 0-usage; a
      warehouse module importing permission directly short-circuits that
      transitive relationship in the wrong direction.

  - host_file: "saleor/seo/__init__.py"
    source_layer: "seo"
    import_line: "from saleor.permission import ArgotFixture"
    target_layer: "permission"
    kind: "transitive_reversal"
    rationale: >-
      seo is a pure mixin (SeoModel) consumed by product/page/category models
      that are themselves gated by permission checks — permission only reaches
      seo transitively through those consumers. Resolver-verified seo ->
      permission is 0-usage; seo reaching directly into permission inverts that
      transitive path.

  - host_file: "saleor/shipping/__init__.py"
    source_layer: "shipping"
    import_line: "from saleor.product import ArgotFixture"
    target_layer: "product"
    kind: "transitive_reversal"
    rationale: >-
      shipping methods reference product-level attributes (weight, shipping
      class) through the order/checkout layers that sit between them, not via
      a direct edge. Resolver-verified shipping -> product is 0-usage;
      shipping importing product directly bypasses (and reverses) that
      transitive relationship.

  - host_file: "saleor/channel/__init__.py"
    source_layer: "channel"
    import_line: "from saleor.account import ArgotFixture"
    target_layer: "account"
    kind: "transitive_reversal"
    rationale: >-
      channel (multi-channel sales config) is consumed by account-scoped
      permission/staff-access logic through intermediate domain layers, so
      account only depends on channel transitively. Resolver-verified channel
      -> account is 0-usage; a channel module reaching directly into account
      reverses that indirect dependency.

  - host_file: "saleor/site/__init__.py"
    source_layer: "site"
    import_line: "from saleor.app import ArgotFixture"
    target_layer: "app"
    kind: "transitive_reversal"
    rationale: >-
      site (global site settings) is read by installed-app bootstrap code
      through the settings/plugin-manager layer that sits between them, not
      directly. Resolver-verified site -> app is 0-usage; site importing app
      directly cuts across that transitive path in the wrong direction.

  - host_file: "saleor/schedulers/__init__.py"
    source_layer: "schedulers"
    import_line: "from saleor.discount import ArgotFixture"
    target_layer: "discount"
    kind: "transitive_reversal"
    rationale: >-
      schedulers is the low-level periodic-task registration mechanism; domain
      apps like discount register their own periodic jobs (e.g. expiring
      promotions) by importing schedulers, not the reverse (discount ->
      schedulers attested, transitively through the task-registration
      machinery). Resolver-verified schedulers -> discount is 0-usage; a
      scheduler module reaching directly into discount inverts the
      registration relationship.

controls:
  # Forward edges: an entry/composition-root layer (auth, asgi) reaching into
  # a domain/core layer. 0-usage at these exact lines, but the layer-level
  # direction is the established one — this is ordinary growth, not a
  # violation, and must not be flagged.
  - host_file: "saleor/auth/__init__.py"
    source_layer: "auth"
    import_line: "from saleor.core import ArgotFixture"
    target_layer: "core"
    rationale: >-
      auth (authentication backends) reaching into core utilities is the
      established direction — auth needs core's shared helpers to validate
      tokens/sessions. Resolver classifies this edge as forward: a new
      auth -> core import is ordinary growth, not a placement mistake.

  - host_file: "saleor/asgi/__init__.py"
    source_layer: "asgi"
    import_line: "from saleor.permission import ArgotFixture"
    target_layer: "permission"
    rationale: >-
      asgi is the ASGI composition root — it wires together the whole
      application, including permission-gated middleware, so it legitimately
      reaches into any domain layer including permission. Resolver classifies
      this edge as forward: an entry-point importing a domain layer is normal
      growth, not a violation.

  - host_file: "saleor/auth/__init__.py"
    source_layer: "auth"
    import_line: "from saleor.webhook import ArgotFixture"
    target_layer: "webhook"
    rationale: >-
      auth reaching into webhook (e.g. to fire an auth-related webhook event
      on login/token-refresh) follows the same entry-layer -> domain-layer
      direction as auth's other established edges. Resolver classifies this as
      forward: legitimate growth, must stay quiet.

  - host_file: "saleor/asgi/__init__.py"
    source_layer: "asgi"
    import_line: "from saleor.product import ArgotFixture"
    target_layer: "product"
    rationale: >-
      asgi, as the composition root, importing the product app to wire it into
      the application graph is exactly the normal entry-point -> domain-app
      direction. Resolver classifies this as forward: not a violation.

  - host_file: "saleor/auth/__init__.py"
    source_layer: "auth"
    import_line: "from saleor.order import ArgotFixture"
    target_layer: "order"
    rationale: >-
      auth reaching into order (e.g. order-scoped permission/ownership checks
      during authentication) follows auth's established entry-layer ->
      domain-layer direction. Resolver classifies this as forward: legitimate
      growth, must not be flagged.

  - host_file: "saleor/asgi/__init__.py"
    source_layer: "asgi"
    import_line: "from saleor.app import ArgotFixture"
    target_layer: "app"
    rationale: >-
      asgi wiring in the installed-apps layer at startup is the composition
      root doing its job — the normal entry-point -> domain-layer direction.
      Resolver classifies this as forward: ordinary growth, not a violation.
