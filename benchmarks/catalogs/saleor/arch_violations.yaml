# Architecture-graph violation fixtures for saleor. Each `import_line` added to
# `host_file` creates the internal edge (source layer -> target layer). Violations
# cross a boundary the repo never crosses; controls respect the established direction.
#
# Layer = first path component under the package root `saleor/`.
# Topology at HEAD 5c872c3d (from `git grep` over absolute `from saleor.<layer>` /
# `import saleor.<layer>` imports, scoped per source layer):
#   - `core` is the universal SINK: 21 layers import it, it imports NO other layer
#     (fan_out = 0). Every `core -> X` edge is therefore 0-usage and sink-leaving.
#   - `graphql` is the top APP layer: it imports order/payment/tax/webhook/discount/
#     giftcard/checkout/core (fan_out = 8); only `permission` ever imports graphql.
#     So every `<domain> -> graphql` edge reverses an attested `graphql -> <domain>`.
#   - `payment -> plugins` (5 files) and `payment -> account` (1 file) are attested,
#     never the reverse.
# Verification method per fixture: the (source -> target) edge is confirmed 0-usage
# with, e.g.:
#   git -C benchmarks/data/saleor/.repo grep -l -E "from saleor.<target>(\.| import)|import saleor.<target>" -- "saleor/<source>/"

violations:
  # ---- reversals (attested B->A, so A->B reverses an established direction) ----
  - host_file: "saleor/order/models.py"
    source_layer: "order"
    import_line: "from saleor.graphql.order.types import Order"
    target_layer: "graphql"
    kind: "reversal"
    rationale: >-
      The order-layer ORM model reaching up into its own GraphQL type — the
      canonical LLM layering mistake. `git grep -lE 'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/order/`
      returns nothing at HEAD (0 files) -> edge order->graphql is 0-usage. The
      reverse is attested: graphql imports order (1 file, e.g. saleor/graphql/order/types.py
      binds saleor.order.models.Order), so this reverses the established graphql->order direction.

  - host_file: "saleor/payment/models.py"
    source_layer: "payment"
    import_line: "from saleor.graphql.payment.types import Payment"
    target_layer: "graphql"
    kind: "reversal"
    rationale: >-
      payment-layer model importing the GraphQL Payment type. `git grep -lE
      'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/payment/`
      returns 0 files -> payment->graphql is 0-usage. Reverse attested: graphql->payment
      (2 files) — graphql/payment/types.py wraps saleor.payment.models. This reverses that direction.

  - host_file: "saleor/webhook/serializers.py"
    source_layer: "webhook"
    import_line: "from saleor.graphql.webhook.subscription_payload import initialize_request"
    target_layer: "graphql"
    kind: "reversal"
    rationale: >-
      A webhook payload serializer pulling in the GraphQL subscription-payload
      machinery. `git grep -lE 'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/webhook/`
      returns 0 files -> webhook->graphql is 0-usage. Reverse attested: graphql->webhook
      (2 files). Reverses the established direction; webhook is a lower layer that graphql consumes.

  - host_file: "saleor/discount/models.py"
    source_layer: "discount"
    import_line: "from saleor.graphql.discount.dataloaders import VoucherByIdLoader"
    target_layer: "graphql"
    kind: "reversal"
    rationale: >-
      discount ORM model importing a GraphQL dataloader. `git grep -lE
      'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/discount/`
      returns 0 files -> discount->graphql is 0-usage. Reverse attested: graphql->discount
      (2 files). Reverses the established graphql->discount direction.

  - host_file: "saleor/checkout/models.py"
    source_layer: "checkout"
    import_line: "from saleor.graphql.checkout.types import Checkout"
    target_layer: "graphql"
    kind: "reversal"
    rationale: >-
      checkout model importing its own GraphQL Checkout type. `git grep -lE
      'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/checkout/`
      returns 0 files -> checkout->graphql is 0-usage. Reverse attested: graphql->checkout
      (1 file, saleor/graphql/checkout/types.py wraps saleor.checkout.models). Reverses that direction.

  - host_file: "saleor/plugins/manager.py"
    source_layer: "plugins"
    import_line: "from saleor.payment.gateway import request_refund_action"
    target_layer: "payment"
    kind: "reversal"
    rationale: >-
      The plugin manager calling straight into the payment gateway. `git grep -lE
      'from saleor.payment(\.| import)|import saleor.payment' -- saleor/plugins/`
      returns 0 files -> plugins->payment is 0-usage. Reverse strongly attested:
      payment->plugins (5 files) — payment drives plugins, not the other way. Reverses that direction.

  - host_file: "saleor/account/models.py"
    source_layer: "account"
    import_line: "from saleor.payment.models import Payment"
    target_layer: "payment"
    kind: "reversal"
    rationale: >-
      account (User) model importing the payment model. `git grep -lE
      'from saleor.payment(\.| import)|import saleor.payment' -- saleor/account/`
      returns 0 files -> account->payment is 0-usage. Reverse attested: payment->account
      (1 file) — payment depends on account, never the reverse. Reverses that direction.

  # ---- sink_out (core is a near-sink: fan_in=21, fan_out=0 — any edge OUT is suspect) ----
  - host_file: "saleor/core/models.py"
    source_layer: "core"
    import_line: "from saleor.order.models import Order"
    target_layer: "order"
    kind: "sink_out"
    rationale: >-
      core is the universal sink (imported by 21 layers, imports none). A core
      model reaching down into the order app inverts the whole dependency spine.
      `git grep -lE 'from saleor.order(\.| import)|import saleor.order' -- saleor/core/`
      returns 0 files -> core->order is 0-usage, and core leaving its sink position is the
      signal (order->core is attested, 10 files).

  - host_file: "saleor/core/middleware.py"
    source_layer: "core"
    import_line: "from saleor.graphql.api import schema"
    target_layer: "graphql"
    kind: "sink_out"
    rationale: >-
      Low-level core middleware importing the assembled GraphQL schema. `git grep -lE
      'from saleor.graphql(\.| import)|import saleor.graphql' -- saleor/core/`
      returns 0 files -> core->graphql is 0-usage. core is a sink (fan_out=0), so any
      outbound edge is anomalous; graphql->core is separately attested (2 files), never the reverse.

  # ---- forward_cross (0-usage, reverse NOT attested — crosses a boundary the repo never crosses) ----
  - host_file: "saleor/checkout/tasks.py"
    source_layer: "checkout"
    import_line: "from saleor.order.models import Order"
    target_layer: "order"
    kind: "forward_cross"
    rationale: >-
      A checkout Celery task touching the order model directly. `git grep -lE
      'from saleor.order(\.| import)|import saleor.order' -- saleor/checkout/`
      returns 0 files -> checkout->order is 0-usage; the reverse order->checkout is ALSO
      0 (not a reversal). checkout and order are kept decoupled — they meet only via graphql/core —
      so this crosses a boundary the repo never crosses, even though it is "forward-ish" in the domain flow.

  - host_file: "saleor/product/models.py"
    source_layer: "product"
    import_line: "from saleor.discount.models import Promotion"
    target_layer: "discount"
    kind: "forward_cross"
    rationale: >-
      product model importing discount's Promotion model. `git grep -lE
      'from saleor.discount(\.| import)|import saleor.discount' -- saleor/product/`
      returns 0 files -> product->discount is 0-usage; reverse discount->product is also 0
      (not a reversal). Both are domain layers that only import core; the repo never wires
      them together directly, so this is a boundary the topology never crosses.

  - host_file: "saleor/shipping/utils.py"
    source_layer: "shipping"
    import_line: "from saleor.warehouse.models import Warehouse"
    target_layer: "warehouse"
    kind: "forward_cross"
    rationale: >-
      A shipping util importing the warehouse model. `git grep -lE
      'from saleor.warehouse(\.| import)|import saleor.warehouse' -- saleor/shipping/`
      returns 0 files -> shipping->warehouse is 0-usage; reverse warehouse->shipping is
      also 0 (not a reversal). Both layers depend only on core and never on each other in the
      repo topology; this crosses a boundary the codebase keeps decoupled.

controls:
  - host_file: "saleor/graphql/checkout/types.py"
    source_layer: "graphql"
    import_line: "from saleor.order.models import Order"
    target_layer: "order"
    rationale: >-
      graphql importing domain models is THE established direction; graphql->order is
      already attested (1 file). Adding another such import in this file is legit growth, not a
      violation. `git grep -lE 'from saleor.order(\.| import)|import saleor.order' -- saleor/graphql/checkout/`
      is currently empty (new at file level) but the layer edge graphql->order exists in the topology,
      so the detector must stay quiet.

  - host_file: "saleor/checkout/problems.py"
    source_layer: "checkout"
    import_line: "from saleor.core.prices import quantize_price"
    target_layer: "core"
    rationale: >-
      checkout->core is the dominant established direction (6 checkout files already import
      core; core imports nothing back). A new checkout->core symbol import is legit and must not
      fire. `git grep -lE 'from saleor.core(\.| import)|import saleor.core' -- saleor/checkout/`
      shows checkout->core is heavily attested; core->checkout is 0, so direction is respected.

  - host_file: "saleor/payment/model_helpers.py"
    source_layer: "payment"
    import_line: "from saleor.core.prices import quantize_price"
    target_layer: "core"
    rationale: >-
      payment->core is established (3 payment files import core; the reverse core->payment
      is 0). A new payment->core price helper import respects the spine and is architecturally
      fine. This specific import is 0-usage in this file but the layer edge is attested, so no flag.

  - host_file: "saleor/graphql/order/dataloaders.py"
    source_layer: "graphql"
    import_line: "from saleor.account.models import User"
    target_layer: "account"
    rationale: >-
      A genuinely NEW forward edge that still respects direction: graphql is the top app
      layer (fan_out=8, imports many domain layers) and account is a widely-depended-upon domain
      layer. `git grep -lE 'from saleor.account(\.| import)|import saleor.account' -- saleor/graphql/`
      returns 0 for the absolute form (edge is new at layer level), but it matches the established
      app->domain shape (graphql -> {order,payment,tax,...}); account->graphql is not attested and
      graphql is not a sink, so the detector must NOT flag it. Tests quiet-on-new-forward-edge.

  - host_file: "saleor/warehouse/reservations.py"
    source_layer: "warehouse"
    import_line: "from saleor.core.exceptions import InsufficientStock"
    target_layer: "core"
    rationale: >-
      warehouse->core is established (2 warehouse files import core; core->warehouse is 0).
      Importing a core exception into a warehouse module is exactly the established direction.
      `git grep -lE 'from saleor.core(\.| import)|import saleor.core' -- saleor/warehouse/` confirms
      warehouse->core is attested; this new symbol import is legit growth, not a violation.
