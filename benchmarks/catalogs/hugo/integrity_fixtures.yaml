controls:
- id: strengthen_1
  tactic: strengthen
  test_file: transform/chain_test.go
  edits:
  - old: "func TestChainZeroTransformers(t *testing.T) {\n\ttr := New()\n\tin := new(bytes.Buffer)\n\t\
      out := new(bytes.Buffer)\n\tif err := tr.Apply(in, out); err != nil {\n\t\tt.Errorf(\"A zero transformer\
      \ chain returned an error.\")\n\t}\n}"
    new: "func TestChainZeroTransformers(t *testing.T) {\n\ttr := New()\n\tin := new(bytes.Buffer)\n\t\
      out := new(bytes.Buffer)\n\tif err := tr.Apply(in, out); err != nil {\n\t\tt.Errorf(\"A zero transformer\
      \ chain returned an error.\")\n\t}\n\tif out.Len() != 0 {\n\t\tt.Errorf(\"Expected an empty output\
      \ buffer, got %d bytes\", out.Len())\n\t}\n}"
  prod_edit:
    file: transform/chain.go
    old: '// Apply passes the given from io.Reader through the transformation chain.

      // The result is written to to.

      func (c *Chain) Apply(to io.Writer, from io.Reader) error {'
    new: '// Apply passes the given from io.Reader through the transformation chain.

      // The result is written to to. An empty chain copies from directly to to.

      func (c *Chain) Apply(to io.Writer, from io.Reader) error {'
  rationale: A second check (output buffer stays empty) is added alongside an Apply doc- comment expansion
    — assertions only grow, must stay silent.
- id: refactor_rename_1
  tactic: refactor_rename
  test_file: transform/chain_test.go
  edits:
  - old: func TestChainingMultipleTransformers(t *testing.T) {
    new: func TestMultipleTransformersChaining(t *testing.T) {
  prod_edit:
    file: transform/chain.go
    old: '// Transformer is the func that needs to be implemented by a transformation step.

      type Transformer func(ft FromTo) error'
    new: '// Transformer is the func that needs to be implemented by a transformation step.

      // It receives a FromTo pair and returns an error if the step failed.

      type Transformer func(ft FromTo) error'
  rationale: Pure rename to the more idiomatic Go test-name order, body byte-identical, alongside an unrelated
    Transformer doc-comment addition — must stay silent.
