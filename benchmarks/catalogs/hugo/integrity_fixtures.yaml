    file: hugolib/page__content.go
    old: "func (c *cachedContentScope) WordCount(ctx context.Context) int {\n\tctx = c.prepareContext(ctx)\n\
      \treturn c.mustContentPlain(ctx).wordCount\n}"
    new: "// WordCount returns the number of words in the rendered content.\nfunc (c *cachedContentScope)\
      \ WordCount(ctx context.Context) int {\n\tctx = c.prepareContext(ctx)\n\treturn c.mustContentPlain(ctx).wordCount\n\
      }"
  rationale: One expected literal flipped at one site (8 -> 9, condition and message kept consistent)
    with nothing else added in the changeset — the isolated retarget shape. Calibrated per RUBRIC-INTEGRITY.md;
    a miss is an honest result.
