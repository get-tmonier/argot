- id: legit_deletion_1
  tactic: legit_deletion
  test_file: test/utils.js
  edits:
  - old: |2+
        it('should handle a type with a malformed parameter and break the loop in acceptParams', () => {
          const result = utils.normalizeType('text/plain;invalid');
          assert.deepEqual(result,{
            value: 'text/plain',
            quality: 1,
            params: {} // No parameters are added since "invalid" has no "="
          });
        });

    new: ''
  prod_edit:
    file: lib/utils.js
    old: |
      exports.normalizeType = function(type){
        return ~type.indexOf('/')
          ? acceptParams(type)
          : { value: (mime.lookup(type) || 'application/octet-stream'), params: {} }
      };

      /**
       * Normalize `types`, for example "html" becomes "text/html".
       *
       * @param {Array} types
       * @return {Array}
       * @api private
       */

      exports.normalizeTypes = function(types) {
        return types.map(exports.normalizeType);
      };


      /**
       * Parse accept params `str` returning an
       * object with `.value`, `.quality` and `.params`.
       *
       * @param {String} str
       * @return {Object}
       * @api private
       */

      function acceptParams (str) {
        var length = str.length;
        var colonIndex = str.indexOf(';');
        var index = colonIndex === -1 ? length : colonIndex;
        var ret = { value: str.slice(0, index).trim(), quality: 1, params: {} };

        while (index < length) {
          var splitIndex = str.indexOf('=', index);
          if (splitIndex === -1) break;

          var colonIndex = str.indexOf(';', index);
          var endIndex = colonIndex === -1 ? length : colonIndex;

          if (splitIndex > endIndex) {
            index = str.lastIndexOf(';', splitIndex - 1) + 1;
            continue;
          }

          var key = str.slice(index, splitIndex).trim();
          var value = str.slice(splitIndex + 1, endIndex).trim();

          if (key === 'q') {
            ret.quality = parseFloat(value);
          } else {
            ret.params[key] = value;
          }

          index = endIndex + 1;
        }

        return ret;
      }
    new: |
      exports.normalizeType = function(type){
        return { value: (mime.lookup(type) || 'application/octet-stream'), params: {} }
      };

      /**
       * Normalize `types`, for example "html" becomes "text/html".
       *
       * @param {Array} types
       * @return {Array}
       * @api private
       */

      exports.normalizeTypes = function(types) {
        return types.map(exports.normalizeType);
      };
  rationale: Same test removed as test_deletion_1, but this time the production symbol it named (acceptParams) is removed in the same changeset — accept-params parsing support is dropped wholesale, test and code together. The feature the test exercised no longer exists.
