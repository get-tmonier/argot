    new: "  timeout.tv_sec = (time_t)-1;\n\n  start_test_timing();\n"
  prod_edit:
    file: lib/multi.c
    old: "  struct curltime expire_time;\n  struct Curl_multi *multi = m;\n\n  /* First, make some basic\
      \ checks that the CURLM handle is a good handle */\n"
    new: "  struct curltime expire_time;\n  struct Curl_multi *multi = m;\n\n  if(!timeout_ms)\n    return\
