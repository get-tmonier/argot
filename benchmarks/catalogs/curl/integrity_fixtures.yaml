    survives (grown with a parameter-validation guard, curl''s own idiom -- see CURLE_BAD_FUNCTION_ARGUMENT
    used the same way across lib/*.c) is the TestFileDeleted shape: the file, not just a function within
    a surviving file, is gone.'
