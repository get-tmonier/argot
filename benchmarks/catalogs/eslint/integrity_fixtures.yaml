- id: legit_deletion_1
  tactic: legit_deletion
  test_file: tests/lib/shared/relative-module-resolver.js
  delete_file: true
  prod_edit:
    file: lib/shared/relative-module-resolver.js
    old: "/**\n * Resolves a Node module relative to another module\n * @param {string} moduleName The name of a Node module, or a path to a Node module.\n * @param {string} relativeToPath An absolute path indicating the module that `moduleName` should be resolved relative to. This must be\n * a file rather than a directory, but the file need not actually exist.\n * @returns {string} The absolute path that would result from calling `require.resolve(moduleName)` in a file located at `relativeToPath`\n * @throws {Error} When the module cannot be resolved.\n */\nfunction resolve(moduleName, relativeToPath) {\n\treturn createRequire(relativeToPath).resolve(moduleName);\n}\n\nexports.resolve = resolve;\n"
    new: ''
  rationale: The whole test file is deleted together with the production feature it exercised — `resolve`/`exports.resolve` is dropped from lib/shared/relative-module-resolver.js in the same changeset, so the code the test exercised does not survive.
