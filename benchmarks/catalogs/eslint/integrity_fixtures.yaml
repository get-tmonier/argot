  edits:
  - old: "\t\tit(\"boolean\", () => {\n\t\t\tassert.isTrue(isSerializable(true));\n\t\t\tassert.isTrue(isSerializable(false));\n\t\t\tassert.isTrue(isSerializable({ a: true }));\n\t\t\tassert.isTrue(isSerializable([true]));\n\t\t});\n"
