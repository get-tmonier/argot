  - old: "\t\tit(\"should remove namespace when passed with namespace\", () => {\n\t\t\tconst namespace = naming.getNamespaceFromTerm(\n\t\t\t\t\"@namespace/eslint-plugin-test\",\n\t\t\t);\n\n\t\t\tassert.strictEqual(namespace, \"@namespace/\");\n\t\t});\n"
    new: "\t\tit(\"should remove namespace when passed with namespace\", () => {\n\t\t\tconst namespace = naming.getNamespaceFromTerm(\n\t\t\t\t\"@namespace/eslint-plugin-test\",\n\t\t\t);\n\n\t\t\tassert.strictEqual(namespace, \"@namespace\");\n\t\t});\n"
  prod_edit:
    file: lib/shared/naming.js
    old: "\treturn match ? match[0] : \"\";\n"
    new: "\treturn match ? match[0].replace(/\\/$/u, \"\") : \"\";\n"
  rationale: getNamespaceFromTerm now strips the trailing slash before returning; the test's expected literal moved to match, same site, nothing else touched — an isolated flip (per RUBRIC-INTEGRITY, retarget is calibrated off by default in most repos; a miss here is the honest expected result).
- id: comparison_widening_1
  tactic: comparison_widening
  rule: test-weakened
  test_file: tests/lib/shared/traverser.js
  edits:
  - old: "\tit(\"traverses AST as using 'visitorKeys' option if given\", () => {\n\t\tconst traverser = new Traverser();\n\t\tconst fakeAst = {\n\t\t\ttype: \"Program\",\n\t\t\tbody: [\n\t\t\t\t{\n\t\t\t\t\ttype: \"ClassDeclaration\",\n\t\t\t\t\tid: {\n\t\t\t\t\t\ttype: \"Identifier\",\n\t\t\t\t\t},\n\t\t\t\t\tsuperClass: null,\n\t\t\t\t\tbody: {\n\t\t\t\t\t\ttype: \"ClassBody\",\n\t\t\t\t\t\tbody: [],\n\t\t\t\t\t},\n\t\t\t\t\texperimentalDecorators: [\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\ttype: \"Decorator\",\n\t\t\t\t\t\t\texpression: {},\n\t\t\t\t\t\t},\n\t\t\t\t\t],\n\t\t\t\t},\n\t\t\t],\n\t\t};\n\n\t\tfakeAst.body[0].parent = fakeAst;\n\n\t\tconst visited = [];\n\n\t\t// with 'visitorKeys' option to traverse decorators.\n\t\ttraverser.traverse(fakeAst, {\n\t\t\tenter: node => visited.push(node.type),\n\t\t\tvisitorKeys: Object.assign({}, Traverser.DEFAULT_VISITOR_KEYS, {\n\t\t\t\tClassDeclaration:\n\t\t\t\t\tTraverser.DEFAULT_VISITOR_KEYS.ClassDeclaration.concat([\n\t\t\t\t\t\t\"experimentalDecorators\",\n\t\t\t\t\t]),\n\t\t\t}),\n\t\t});\n\t\tassert.deepStrictEqual(visited, [\n\t\t\t\"Program\",\n\t\t\t\"ClassDeclaration\",\n\t\t\t\"Identifier\",\n\t\t\t\"ClassBody\",\n\t\t\t\"Decorator\",\n\t\t]);\n\t});\n"
    new: "\tit(\"traverses AST as using 'visitorKeys' option if given\", () => {\n\t\tconst traverser = new Traverser();\n\t\tconst fakeAst = {\n\t\t\ttype: \"Program\",\n\t\t\tbody: [\n\t\t\t\t{\n\t\t\t\t\ttype: \"ClassDeclaration\",\n\t\t\t\t\tid: {\n\t\t\t\t\t\ttype: \"Identifier\",\n\t\t\t\t\t},\n\t\t\t\t\tsuperClass: null,\n\t\t\t\t\tbody: {\n\t\t\t\t\t\ttype: \"ClassBody\",\n\t\t\t\t\t\tbody: [],\n\t\t\t\t\t},\n\t\t\t\t\texperimentalDecorators: [\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\ttype: \"Decorator\",\n\t\t\t\t\t\t\texpression: {},\n\t\t\t\t\t\t},\n\t\t\t\t\t],\n\t\t\t\t},\n\t\t\t],\n\t\t};\n\n\t\tfakeAst.body[0].parent = fakeAst;\n\n\t\tconst visited = [];\n\n\t\t// with 'visitorKeys' option to traverse decorators.\n\t\ttraverser.traverse(fakeAst, {\n\t\t\tenter: node => visited.push(node.type),\n\t\t\tvisitorKeys: Object.assign({}, Traverser.DEFAULT_VISITOR_KEYS, {\n\t\t\t\tClassDeclaration:\n\t\t\t\t\tTraverser.DEFAULT_VISITOR_KEYS.ClassDeclaration.concat([\n\t\t\t\t\t\t\"experimentalDecorators\",\n\t\t\t\t\t]),\n\t\t\t}),\n\t\t});\n\t\tassert.ok(visited.length);\n\t});\n"
  prod_edit:
    file: lib/shared/traverser.js
    old: "\treturn x !== null && typeof x === \"object\" && typeof x.type === \"string\";\n"
    new: "\treturn x !== null && typeof x === \"object\" && !Array.isArray(x) && typeof x.type === \"string\";\n"
  rationale: The exact visited-order check is downgraded to a bare length-truthiness check on the same subject — still "passes", checks far less about traversal order.
