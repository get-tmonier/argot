- id: assertion_deletion_1
  tactic: assertion_deletion
  rule: test-weakened
  test_file: tests/lib/shared/traverser.js
  edits:
  - old: "\tit(\"traverses all keys except 'parent', 'leadingComments', and 'trailingComments'\", () => {\n\t\tconst traverser = new Traverser();\n\t\tconst fakeAst = {\n\t\t\ttype: \"Program\",\n\t\t\tbody: [\n\t\t\t\t{\n\t\t\t\t\ttype: \"ExpressionStatement\",\n\t\t\t\t\tleadingComments: {\n\t\t\t\t\t\ttype: \"Line\",\n\t\t\t\t\t},\n\t\t\t\t\ttrailingComments: {\n\t\t\t\t\t\ttype: \"Block\",\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\ttype: \"FooStatement\",\n\t\t\t\t\tfoo: {\n\t\t\t\t\t\ttype: \"BarStatement\",\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t],\n\t\t};\n\n\t\tfakeAst.body[0].parent = fakeAst;\n\n\t\tconst enteredNodes = [];\n\t\tconst exitedNodes = [];\n\n\t\ttraverser.traverse(fakeAst, {\n\t\t\tenter: node => enteredNodes.push(node),\n\t\t\tleave: node => exitedNodes.push(node),\n\t\t});\n\n\t\tassert.deepStrictEqual(enteredNodes, [\n\t\t\tfakeAst,\n\t\t\tfakeAst.body[0],\n\t\t\tfakeAst.body[1],\n\t\t\tfakeAst.body[1].foo,\n\t\t]);\n\t\tassert.deepStrictEqual(exitedNodes, [\n\t\t\tfakeAst.body[0],\n\t\t\tfakeAst.body[1].foo,\n\t\t\tfakeAst.body[1],\n\t\t\tfakeAst,\n\t\t]);\n\t});\n"
    new: "\tit(\"traverses all keys except 'parent', 'leadingComments', and 'trailingComments'\", () => {\n\t\tconst traverser = new Traverser();\n\t\tconst fakeAst = {\n\t\t\ttype: \"Program\",\n\t\t\tbody: [\n\t\t\t\t{\n\t\t\t\t\ttype: \"ExpressionStatement\",\n\t\t\t\t\tleadingComments: {\n\t\t\t\t\t\ttype: \"Line\",\n\t\t\t\t\t},\n\t\t\t\t\ttrailingComments: {\n\t\t\t\t\t\ttype: \"Block\",\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\ttype: \"FooStatement\",\n\t\t\t\t\tfoo: {\n\t\t\t\t\t\ttype: \"BarStatement\",\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t],\n\t\t};\n\n\t\tfakeAst.body[0].parent = fakeAst;\n\n\t\tconst enteredNodes = [];\n\t\tconst exitedNodes = [];\n\n\t\ttraverser.traverse(fakeAst, {\n\t\t\tenter: node => enteredNodes.push(node),\n\t\t\tleave: node => exitedNodes.push(node),\n\t\t});\n\n\t\tassert.deepStrictEqual(enteredNodes, [\n\t\t\tfakeAst,\n\t\t\tfakeAst.body[0],\n\t\t\tfakeAst.body[1],\n\t\t\tfakeAst.body[1].foo,\n\t\t]);\n\t});\n"
  prod_edit:
    file: lib/shared/traverser.js
    old: "\treturn x !== null && typeof x === \"object\" && typeof x.type === \"string\";\n"
    new: "\treturn x !== null && typeof x === \"object\" && !Array.isArray(x) && typeof x.type === \"string\";\n"
  rationale: The enter-order assertion survives untouched; only the leave-order assertion is excised, so the test still "checks something".
