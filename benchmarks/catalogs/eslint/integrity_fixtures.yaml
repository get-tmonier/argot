  - old: "\t\tit(\"number\", () => {\n\t\t\tassert.isTrue(isSerializable(123));\n\t\t\tassert.isTrue(isSerializable({ a: 123 }));\n\t\t\tassert.isTrue(isSerializable([123]));\n\t\t});\n"
