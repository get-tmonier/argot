# Architecture-graph violation fixtures for eslint (JavaScript, single-package repo).
# Each `import_line` added to `host_file` creates the internal edge
# (source layer -> target layer). Violations cross a boundary the repo's
# established direction never crosses; controls respect that direction.
#
# Layer = first path component under the repo root (this is a single-package
# repo, not a monorepo — no workspace-root prefixing needed). Six layers are
# host-mapped here (files exist for both source and target on at least one
# candidate edge):
#   - `bin` (`bin/eslint.js`): the CLI entry point.
#   - `__root__`: files sitting directly at the repo root with no
#     subdirectory — here just `Makefile.js`, the build/release/lint driver
#     script invoked via `node Makefile.js <target>`.
#   - `conf` (`conf/ecma-version.js`, `conf/globals.js`): small static
#     configuration data (the latest supported ECMA version, global-variable
#     tables). Zero outbound edges to any other tracked layer — confirmed by
#     `grep -n require conf/*.js`, which returns nothing but an unrelated
#     `require: false` ESLint global-directive key, not an actual `require()`
#     call. A pure leaf.
#   - `lib`: the core library. Its package.json `"main"` entry is
#     `lib/api.js`, which re-exports `ESLint`, `Linter`, `RuleTester`,
#     `SourceCode`. `lib` consumes `conf` (see below) but has no attested
#     edges to `tools`, `configs`, or `__root__`.
#   - `tools` (`tools/check-emfile-handling.js` and siblings): maintainer
#     scripts (fuzzers, doc generators, config-preset generators). Nothing
#     in `bin`, `lib`, `conf`, or `configs` ever imports from `tools` — it
#     sits at the top of the graph alongside `__root__`.
#   - `configs` (`packages/js/src/configs/eslint-all.js`,
#     `eslint-recommended.js`): autogenerated shareable rule-config presets.
#     `eslint-all.js` itself opens with "WARNING: This file is autogenerated
#     using the tools/update-eslint-all.js script. Do not edit manually." —
#     it is a build *output* of `tools`, not an independent module. Zero
#     outbound edges to any other tracked layer.
#
# Established directions (from real HEAD requires, confirmed with grep):
#   - `lib -> conf`: `lib/languages/js/index.js:19` and
#     `lib/rules/utils/ast-utils.js:23` both
#     `require("../../../conf/ecma-version")`.
#   - `tools -> lib`: `tools/check-rule-examples.js:15,17`
#     (`../lib/rules`, `../lib/linter`), `tools/generate-formatter-examples.js:20`
#     (`../lib/api`), `tools/config-rule.js:12`, `tools/update-eslint-all.js:13`,
#     `tools/update-eslint-recommended.js:13` (all `../lib/rules`).
#   - `tools -> conf`: `tools/check-rule-examples.js:16`
#     `require("../conf/ecma-version")`.
#   - `tools -> configs`: `tools/generate-formatter-examples.js:22`
#     `require("../packages/js")`; more tellingly, `tools/update-eslint-all.js:46`
#     *writes* `./packages/js/src/configs/eslint-all.js` and
#     `tools/update-eslint-recommended.js:52` writes the sibling
#     `eslint-recommended.js` — `tools` doesn't just consume `configs`, it
#     generates it.
#   - `__root__ -> lib`: `Makefile.js:22` and `Makefile.js:754` both
#     `require("./lib/rules")` (and `./lib/rules/index`).
#   - `__root__ -> tools`: `Makefile.js:584` `require("./tools/fuzzer-runner")`.
#   - `__root__ -> configs`: `Makefile.js:889`
#     `require("./packages/js").configs.recommended`.
#   - `__root__ -> conf`: `Makefile.js:180` defaults a CLI option to
#     `"conf/rule-type-list.json"` — a direct repo-root reference into `conf`.
#   - `bin -> lib`: `bin/eslint.js:190` `require("../lib/cli")`.
#
# So the rank order (foundational -> entry point) is:
#   conf, configs  (pure leaves, 0 outbound)
#     <-  lib       (consumes conf only)
#       <-  tools, __root__, bin  (consume lib; tools/root also reach conf/configs directly)
#
# Every (kind, host_file, import_line) below is copied verbatim from the
# resolver-verified candidate menu (`/tmp/arch-w2/candidates-eslint.md`),
# which independently confirmed each edge is 0-usage in the given direction.
# eslint has only ~10 catchable candidates total (6 host-mapped layers, a
# single-package repo) — this file uses 8 of the 10, dropping the two
# thinnest-population duplicates of an already-represented pairing
# (`configs -> tools`, `lib -> configs`, both pop 1-2) to avoid padding the
# fixture set with redundant sink-boundary evidence.

violations:
  # ---- reversals (direct pairwise reverse attested at HEAD) ----
  - host_file: "conf/ecma-version.js"
    source_layer: "conf"
    import_line: "import { ArgotFixture } from '../lib/api';\n"
    target_layer: "lib"
    kind: "reversal"
    rationale: >-
      conf is a pure leaf (0 outbound edges to any tracked layer; see header).
      The reverse is attested directly and repeatedly: `lib/languages/js/index.js:19`
      and `lib/rules/utils/ast-utils.js:23` both
      `require("../../../conf/ecma-version")` — lib consumes conf, never the
      other way. conf->lib is 0-usage; this reverses the established
      lib->conf direction.

  - host_file: "lib/api.js"
    source_layer: "lib"
    import_line: "import { ArgotFixture } from '../tools/check-emfile-handling';\n"
    target_layer: "tools"
    kind: "reversal"
    rationale: >-
      The package's main entry point (`lib/api.js`, which re-exports ESLint/
      Linter/RuleTester/SourceCode) reaching into a maintainer script.
      Reverse attested directly: `tools/generate-formatter-examples.js:20`
      imports this exact file (`require("../lib/api")`), and
      `tools/check-rule-examples.js:15,17` import `../lib/rules` and
      `../lib/linter` — tools consumes lib extensively, never the reverse.
      lib->tools is 0-usage; this inverts the established tools->lib
      direction.

  - host_file: "conf/ecma-version.js"
    source_layer: "conf"
    import_line: "import { ArgotFixture } from '../tools/check-emfile-handling';\n"
    target_layer: "tools"
    kind: "reversal"
    rationale: >-
      Same leaf, same inversion as the conf->lib edge above, one layer
      further out: `tools/check-rule-examples.js:16` imports this exact file
      (`require("../conf/ecma-version")`) — tools consumes conf directly.
      conf->tools is 0-usage; a pure leaf reaching up into one of its own
      consumers is the canonical reversal.

  - host_file: "packages/js/src/configs/eslint-all.js"
    source_layer: "configs"
    import_line: "import { ArgotFixture } from '../../../../Makefile';\n"
    target_layer: "__root__"
    kind: "reversal"
    rationale: >-
      configs is an autogenerated preset file (its own header warns "Do not
      edit manually") with 0 outbound edges. Reverse attested directly:
      `Makefile.js:889` requires `./packages/js` and reads
      `.configs.recommended` — __root__ consumes configs, never the reverse.
      configs->__root__ is 0-usage; a generated leaf reaching into the
      repo-root build driver inverts that established direction.

  # ---- transitive_reversal (no direct pairwise attestation, but the target
  #      is reached only via an already-attested multi-hop chain, or a
  #      rank the repo never crosses in this direction) ----
  - host_file: "packages/js/src/configs/eslint-all.js"
    source_layer: "configs"
    import_line: "import { ArgotFixture } from '../../../../lib/api';\n"
    target_layer: "lib"
    kind: "transitive_reversal"
    rationale: >-
      configs and lib have no direct pairwise attestation in either
      direction, but both sit at the same low rank relative to tools/root:
      tools generates configs (`tools/update-eslint-all.js:46` writes
      `./packages/js/src/configs/eslint-all.js`) and separately consumes lib
      (`tools/check-rule-examples.js:15,17`); __root__ likewise reaches both
      (`Makefile.js:22` into lib, `Makefile.js:889` into configs). Neither
      leaf has ever reached sideways into the other. configs->lib is
      0-usage and, via that shared-consumer chain, inverts configs'
      established leaf position — mirroring the direct conf->lib reversal
      above.

  - host_file: "conf/ecma-version.js"
    source_layer: "conf"
    import_line: "import { ArgotFixture } from '../Makefile';\n"
    target_layer: "__root__"
    kind: "transitive_reversal"
    rationale: >-
      conf has 0 outbound edges (see header) and __root__ already reaches
      into every layer above conf's rank — lib (`Makefile.js:22`), tools
      (`Makefile.js:584`), configs (`Makefile.js:889`), and conf itself by
      path reference (`Makefile.js:180`, `"conf/rule-type-list.json"`) — but
      no file in `conf/` has ever required anything back. conf->__root__ is
      0-usage and, via that already-attested __root__ reach into every other
      layer, inverts conf's established leaf-only position.

  # ---- sink_out (source is itself an established zero-outbound sink; this
  #      edge would give it its first outbound edge, "leaving" the sink) ----
  - host_file: "packages/js/src/configs/eslint-all.js"
    source_layer: "configs"
    import_line: "import { ArgotFixture } from '../../../../conf/ecma-version';\n"
    target_layer: "conf"
    kind: "sink_out"
    rationale: >-
      configs is a repo-graph sink: consumed by tools (3 files: check-emfile-
      handling's siblings `update-eslint-all.js`, `update-eslint-recommended.js`,
      `generate-formatter-examples.js`) and by __root__ (`Makefile.js:889`),
      with 0 attested outbound edges of its own — it is a generated artifact,
      not a module that reaches out. This edge would be configs' first-ever
      outbound edge, into conf; 0-usage, and it inverts the sink's
      established consumed-only role.

  - host_file: "conf/ecma-version.js"
    source_layer: "conf"
    import_line: "import { ArgotFixture } from '../packages/js/src/configs/eslint-all';\n"
    target_layer: "configs"
    kind: "sink_out"
    rationale: >-
      The twin of the edge above, in the other direction: conf is itself a
      sink (consumed by lib x2 and tools x1, 0 outbound edges — see header).
      This would be conf's first-ever outbound edge, landing in configs —
      another zero-outbound sink layer that has never sent an edge to
      anything. Both directions between these two sinks are unattested;
      either one leaving its sink role is 0-usage.

controls:
  - host_file: "Makefile.js"
    source_layer: "__root__"
    import_line: "import { ArgotFixture } from './conf/ecma-version';\n"
    target_layer: "conf"
    rationale: >-
      __root__ already reaches into conf by path reference
      (`Makefile.js:180`, defaulting a CLI option to
      `"conf/rule-type-list.json"`) and into every layer above conf's rank
      (lib at `:22`, tools at `:584`, configs at `:889`). A direct module
      import of conf/ecma-version from the same orchestration script is
      continuous with that established __root__ -> conf reach, not a new
      direction. Must not fire.

  - host_file: "bin/eslint.js"
    source_layer: "bin"
    import_line: "import { ArgotFixture } from '../conf/ecma-version';\n"
    target_layer: "conf"
    rationale: >-
      bin already reaches into lib (`bin/eslint.js:190`,
      `require("../lib/cli")`), which itself reaches into conf
      (`lib/languages/js/index.js:19`). bin sits at the top of the rank
      order as the CLI entry point; reaching one layer further down into
      conf — the same leaf its own dependency (lib) already depends on — is
      within its established "entry point consumes everything below it"
      position, not a new direction. Must not fire.

  - host_file: "bin/eslint.js"
    source_layer: "bin"
    import_line: "import { ArgotFixture } from '../tools/check-emfile-handling';\n"
    target_layer: "tools"
    rationale: >-
      bin and __root__ are sibling top-rank entry/orchestration layers —
      neither is ever a dependency of the other or of tools. __root__
      already reaches into tools for real (`Makefile.js:584`,
      `require("./tools/fuzzer-runner")`). bin, occupying the same rank,
      reaching into tools mirrors that established sibling-layer direction.
      Must not fire.

  - host_file: "tools/check-emfile-handling.js"
    source_layer: "tools"
    import_line: "import { ArgotFixture } from '../packages/js/src/configs/eslint-all';\n"
    target_layer: "configs"
    rationale: >-
      Directly attested elsewhere in the same layer: `tools/update-eslint-all.js:46`
      writes `./packages/js/src/configs/eslint-all.js` (tools generates this
      exact file) and `tools/generate-formatter-examples.js:22` requires
      `../packages/js`. A sibling tools script importing configs matches the
      layer's own established, repeated tools -> configs direction exactly.
      Must not fire.
