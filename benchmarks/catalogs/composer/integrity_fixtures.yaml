      old: |2-
            public static function getComposerJson(string $pathToArchive): ?string
            {
                // Guard against unsafe Phar/PharData metadata handling on PHP < 8.0
                Platform::assertPharMetadataSafe();

                $phar = new \PharData($pathToArchive);

                if (!$phar->valid()) {
                    return null;
                }

                return self::extractComposerJsonFromFolder($phar);
            }
      new: |2-
            public static function getComposerJson(string $pathToArchive): ?string
            {
                // Guard against unsafe Phar/PharData metadata handling on PHP < 8.0
                Platform::assertPharMetadataSafe();

                if (!is_file($pathToArchive)) {
                    return null;
                }

                $phar = new \PharData($pathToArchive);

                if (!$phar->valid()) {
                    return null;
                }

                return self::extractComposerJsonFromFolder($phar);
            }
    rationale: >-
      Casing typo fixed in the test name, body byte-identical, alongside a small
      defensive prod change — must stay silent.
