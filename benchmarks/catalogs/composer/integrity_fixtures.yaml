      new: |2-
            public function format(?string $message): ?string
            {
                $formatted = parent::format($message);

                if ($formatted === null) {
                    return null;
                }

                if (strpos($formatted, "\033[") === false) {
                    return $formatted;
                }

                $clearEscapeCodes = '(?:39|49|0|22|24|25|27|28)';

                return Preg::replaceCallback("{\033\[([0-9;]+)m(.*?)\033\[(?:".$clearEscapeCodes.";)*?".$clearEscapeCodes."m}s", Closure::fromCallable([$this, 'formatHtml']), $formatted);
            }
    rationale: >-
      The exact full-HTML equality check is downgraded to a substring check on
      just the changed span; it still "checks something" so it reads as reasonable
      next to the new early-return optimisation.
