# What a redis maintainer would mute: deps/ is vendored third-party code
# (hiredis, jemalloc, lua, linenoise, hdr_histogram, fpconv, tre, xxhash) —
# not redis' own voice. Attesting it makes bundled libraries (e.g. libevent,
# via hiredis' example adapters) look like patterns the repo already uses.
[exclude]
paths = ["deps/"]
