controls:
- id: strengthen_1
  tactic: strengthen
  test_file: tests/modules/misc.c
  edits:
  - old: "    RedisModuleClientInfoV1 ci = REDISMODULE_CLIENTINFO_INITIALIZER_V1;\n    uint64_t client_id\
      \ = RedisModule_GetClientId(ctx);\n\n    /* Check expected result from the V1 initializer. */\n"
    new: "    RedisModuleClientInfoV1 ci = REDISMODULE_CLIENTINFO_INITIALIZER_V1;\n    uint64_t client_id\
      \ = RedisModule_GetClientId(ctx);\n    assert(client_id != 0);\n\n    /* Check expected result from\
      \ the V1 initializer. */\n"
  prod_edit:
    file: src/util.c
    old: "int string2ull(const char *s, unsigned long long *value) {\n    long long ll;\n    if (string2ll(s,strlen(s),&ll))\
      \ {\n"
    new: "int string2ull(const char *s, unsigned long long *value) {\n    long long ll;\n\n    if (!s\
      \ || !value)\n        return 0;\n\n    if (string2ll(s,strlen(s),&ll)) {\n"
  rationale: A new, real, non-literal assertion (`assert(client_id != 0)`) is added right after the client
    ID is fetched, alongside the two pre-existing assertions (both untouched) -- pure strengthening. Must
    not fire tautology (subject is an identifier) or any weaken/disable event.
