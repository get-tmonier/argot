      '
    new: 'int test_key_slot(RedisModuleCtx *ctx, RedisModuleString **argv, int argc) {

      '
  - old: '    if (RedisModule_CreateCommand(ctx, "test.keyslot", test_keyslot, "", 0, 0, 0) == REDISMODULE_ERR)

      '
    new: '    if (RedisModule_CreateCommand(ctx, "test.key_slot", test_key_slot, "", 0, 0, 0) == REDISMODULE_ERR)

      '
  prod_edit:
    file: src/util.c
    old: "int string2l(const char *s, size_t slen, long *lval) {\n    long long llval;\n\n    if (!string2ll(s,slen,&llval))\n\
      \        return 0;\n"
    new: "int string2l(const char *s, size_t slen, long *lval) {\n    long long llval;\n\n    if (!s ||\
      \ !slen)\n        return 0;\n\n    if (!string2ll(s,slen,&llval))\n        return 0;\n"
  rationale: test_keyslot is renamed to test_key_slot (definition and its RedisModule_CreateCommand registration
