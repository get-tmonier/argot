- id: churn_move_1
  tactic: churn_move
  test_file: tests/modules/misc.c
  edits:
  - old: 'int test_clientinfo(RedisModuleCtx *ctx, RedisModuleString **argv, int argc)

      {

      '
    new: "static void check_clientinfo_version(RedisModuleClientInfoV1 *ci, uint64_t client_id) {\n  \
      \  ci->version = REDISMODULE_CLIENTINFO_VERSION + 1;\n    assert(RedisModule_GetClientInfoById(ci,\
      \ client_id) == REDISMODULE_ERR);\n}\n\nint test_clientinfo(RedisModuleCtx *ctx, RedisModuleString\
      \ **argv, int argc)\n{\n"
  - old: "    /* Trying to populate a future version of the struct should fail. */\n    ci.version = REDISMODULE_CLIENTINFO_VERSION\
      \ + 1;\n    assert(RedisModule_GetClientInfoById(&ci, client_id) == REDISMODULE_ERR);\n\n    ci.version\
      \ = 1;\n"
    new: "    /* Trying to populate a future version of the struct should fail. */\n    check_clientinfo_version(&ci,\
      \ client_id);\n\n    ci.version = 1;\n"
  prod_edit:
    file: src/util.c
    old: "int string2ull(const char *s, unsigned long long *value) {\n    long long ll;\n    if (string2ll(s,strlen(s),&ll))\
      \ {\n"
    new: "int string2ull(const char *s, unsigned long long *value) {\n    long long ll;\n\n    if (!s\
      \ || !value)\n        return 0;\n\n    if (string2ll(s,strlen(s),&ll)) {\n"
  rationale: 'A realistic extract-helper refactor: test_clientinfo''s second check (the future-version-rejection
    assertion) is pulled out into a small static helper, check_clientinfo_version, called from the same
    test with identical net behaviour and the identical assertion. This is a genuine edge case for the
    detector: the walker only extracts assertions from Test-prefixed function bodies, and check_clientinfo_version
    is not itself named test_/Test-prefixed, so its assertion becomes invisible to the changeset-wide
    site accounting even though the check still executes. Authored and reported as-is, not softened, per
    the verification protocol -- whichever way it resolves is real information about the detector''s blind
    spot for helper-extracted assertions.'
