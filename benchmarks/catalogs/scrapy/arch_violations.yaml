# Architecture-graph violation fixtures for scrapy.
#
# Package root: scrapy/ (the dir with __init__.py). A "layer" = the first path
# component under scrapy/ (e.g. scrapy/core/engine.py -> core;
# scrapy/http/request/__init__.py -> http). Top-level modules directly in
# scrapy/ are layer __root__ and are never used as source or target here.
#
# Established topology (from `git grep` over the repo at HEAD):
#   Sinks / near-sinks (heavily imported, tiny out-degree):
#     utils   <- imported by nearly every layer; out -> {http, settings, spiders, selector, core}
#     http    <- imported by 10+ layers; out-degree 2 -> {utils, selector}
#     selector<- imported by {http, loader, spiders}; out-degree 2 -> {utils, http}
#     settings<- imported by 8 layers; out-degree 1 -> {utils}
#   High-level layers (import a lot, imported by ~nobody):
#     commands (CLI; only scrapy/cmdline.py imports it), core, pipelines,
#     downloadermiddlewares & spidermiddlewares (wired via settings strings,
#     imported by no layer), extensions.
#
# Every violation edge (source_layer -> target_layer) was verified 0-usage with
#   git -C benchmarks/data/scrapy/.repo grep -l \
#     "from scrapy.<target>\b\|import scrapy.<target>\b" -- "scrapy/<source>/"
# returning zero files. Reverse-direction attestation counts come from
#   git grep -h "from scrapy.<X>" -- "scrapy/<Y>/" | wc -l.

violations:
  # ---- reversal (7): reverse edge B->A is attested, A->B is 0-usage ----

  - host_file: "scrapy/utils/misc.py"
    source_layer: "utils"
    import_line: "from scrapy.commands import ScrapyCommand"
    target_layer: "commands"
    kind: "reversal"
    rationale: >-
      utils (the most heavily imported low-level layer) reaching up into
      commands (the high-level CLI). `git grep -l 'from scrapy.commands\b\|import
      scrapy.commands\b' -- scrapy/utils/` -> 0 files (0-usage). Reverse
      commands->utils is attested 21x, so this reverses an established direction.
      ScrapyCommand is a real export of scrapy/commands/__init__.py.

  - host_file: "scrapy/http/response/text.py"
    source_layer: "http"
    import_line: "from scrapy.core.engine import ExecutionEngine"
    target_layer: "core"
    kind: "reversal"
    rationale: >-
      http (a near-sink, out-degree 2) importing core (the engine that sits far
      above it). `git grep -l 'from scrapy.core\b\|import scrapy.core\b' --
      scrapy/http/` -> 0 files (0-usage). Reverse core->http is attested 19x.
      Reversal. ExecutionEngine is a real class in scrapy/core/engine.py.

  - host_file: "scrapy/http/request/__init__.py"
    source_layer: "http"
    import_line: "from scrapy.spiders import Spider"
    target_layer: "spiders"
    kind: "reversal"
    rationale: >-
      http importing spiders. `git grep -l 'from scrapy.spiders\b\|import
      scrapy.spiders\b' -- scrapy/http/` -> 0 files (0-usage). Reverse
      spiders->http is attested 8x. Reversal. Spider is exported by
      scrapy/spiders/__init__.py.

  - host_file: "scrapy/utils/serialize.py"
    source_layer: "utils"
    import_line: "from scrapy.pipelines.files import FilesPipeline"
    target_layer: "pipelines"
    kind: "reversal"
    rationale: >-
      utils importing pipelines (item-processing, high-level). `git grep -l
      'from scrapy.pipelines\b\|import scrapy.pipelines\b' -- scrapy/utils/` -> 0
      files (0-usage). Reverse pipelines->utils is attested 18x. Reversal.
      FilesPipeline is a real class in scrapy/pipelines/files.py.

  - host_file: "scrapy/http/cookies.py"
    source_layer: "http"
    import_line: "from scrapy.downloadermiddlewares.cookies import CookiesMiddleware"
    target_layer: "downloadermiddlewares"
    kind: "reversal"
    rationale: >-
      http reaching into the download-middleware layer that consumes it. `git
      grep -l 'from scrapy.downloadermiddlewares\b\|import
      scrapy.downloadermiddlewares\b' -- scrapy/http/` -> 0 files (0-usage).
      Reverse downloadermiddlewares->http is attested 18x. Reversal.
      CookiesMiddleware is a real class in scrapy/downloadermiddlewares/cookies.py.

  - host_file: "scrapy/utils/response.py"
    source_layer: "utils"
    import_line: "from scrapy.extensions.logstats import LogStats"
    target_layer: "extensions"
    kind: "reversal"
    rationale: >-
      utils importing an extension. `git grep -l 'from scrapy.extensions\b\|import
      scrapy.extensions\b' -- scrapy/utils/` -> 0 files (0-usage). Reverse
      extensions->utils is attested 27x (extensions lean heavily on utils).
      Reversal. LogStats is a real class in scrapy/extensions/logstats.py.

  - host_file: "scrapy/http/headers.py"
    source_layer: "http"
    import_line: "from scrapy.pipelines.media import MediaPipeline"
    target_layer: "pipelines"
    kind: "reversal"
    rationale: >-
      http importing pipelines. `git grep -l 'from scrapy.pipelines\b\|import
      scrapy.pipelines\b' -- scrapy/http/` -> 0 files (0-usage). Reverse
      pipelines->http is attested 6x. Reversal. MediaPipeline is a real class in
      scrapy/pipelines/media.py.

  # ---- sink_out (2): a near-sink (tiny out-degree) sprouts a new outgoing edge
  #      to a higher-level layer it never touches; both directions 0-usage ----

  - host_file: "scrapy/settings/default_settings.py"
    source_layer: "settings"
    import_line: "from scrapy.linkextractors import LinkExtractor"
    target_layer: "linkextractors"
    kind: "sink_out"
    rationale: >-
      settings is a near-sink: out-degree 1 (it imports only utils) yet is
      imported by 8 layers. A new outgoing edge to linkextractors leaves that
      sink. `git grep -l 'from scrapy.linkextractors\b\|import
      scrapy.linkextractors\b' -- scrapy/settings/` -> 0 files, and reverse `git
      grep -l 'from scrapy.settings\b\|import scrapy.settings\b' --
      scrapy/linkextractors/` -> 0 files: neither direction attested, so this is
      a pure sink-leak, not a reversal. LinkExtractor is exported by
      scrapy/linkextractors/__init__.py.

  - host_file: "scrapy/selector/unified.py"
    source_layer: "selector"
    import_line: "from scrapy.commands.crawl import Command"
    target_layer: "commands"
    kind: "sink_out"
    rationale: >-
      selector is a near-sink (out-degree 2 -> {utils, http}), imported by
      http/loader/spiders. Making it import commands (the high-level CLI) leaks
      out of the sink. `git grep -l 'from scrapy.commands\b\|import
      scrapy.commands\b' -- scrapy/selector/` -> 0 files, and reverse `git grep
      -l 'from scrapy.selector\b\|import scrapy.selector\b' -- scrapy/commands/`
      -> 0 files: neither direction attested (pure sink-leak). Command is a real
      class in scrapy/commands/crawl.py.

  # ---- forward_cross (3): a plausible-forward edge between sibling mid-level
  #      layers that the topology has never had (both directions 0-usage) ----

  - host_file: "scrapy/downloadermiddlewares/redirect.py"
    source_layer: "downloadermiddlewares"
    import_line: "from scrapy.spidermiddlewares.depth import DepthMiddleware"
    target_layer: "spidermiddlewares"
    kind: "forward_cross"
    rationale: >-
      Two sibling middleware layers that are wired independently and never
      import each other. `git grep -l 'from scrapy.spidermiddlewares\b\|import
      scrapy.spidermiddlewares\b' -- scrapy/downloadermiddlewares/` -> 0 files,
      and reverse -> scrapy/spidermiddlewares/ -> 0 files: the downloader- and
      spider-middleware layers have no edge in either direction. Cross-layer
      import the topology never has. DepthMiddleware is a real class in
      scrapy/spidermiddlewares/depth.py.

  - host_file: "scrapy/spidermiddlewares/httperror.py"
    source_layer: "spidermiddlewares"
    import_line: "from scrapy.pipelines.media import MediaPipeline"
    target_layer: "pipelines"
    kind: "forward_cross"
    rationale: >-
      A spider middleware reaching into the item pipelines layer. `git grep -l
      'from scrapy.pipelines\b\|import scrapy.pipelines\b' --
      scrapy/spidermiddlewares/` -> 0 files, and reverse pipelines->spidermiddlewares
      -> 0 files: no edge either way. Cross-layer import the topology never has.
      MediaPipeline is a real class in scrapy/pipelines/media.py.

  - host_file: "scrapy/extensions/feedexport.py"
    source_layer: "extensions"
    import_line: "from scrapy.pipelines.files import FilesPipeline"
    target_layer: "pipelines"
    kind: "forward_cross"
    rationale: >-
      An extension reaching into item pipelines. `git grep -l 'from
      scrapy.pipelines\b\|import scrapy.pipelines\b' -- scrapy/extensions/` -> 0
      files, and reverse pipelines->extensions -> 0 files: no edge either way.
      Cross-layer import the topology never has. FilesPipeline is a real class in
      scrapy/pipelines/files.py.

controls:
  # Realistic NEW cross-layer imports that RESPECT the established direction.
  # The source->target layer edge already exists in the graph, so a new import
  # along it is not a new edge at all -> must NOT be flagged.

  - host_file: "scrapy/core/scheduler.py"
    source_layer: "core"
    import_line: "from scrapy.utils.misc import load_object"
    target_layer: "utils"
    rationale: >-
      core->utils is the single most established direction in the repo (attested
      51x). A new utility import from a core module is idiomatic, not a
      violation. load_object is a real function in scrapy/utils/misc.py.

  - host_file: "scrapy/core/engine.py"
    source_layer: "core"
    import_line: "from scrapy.http import Response"
    target_layer: "http"
    rationale: >-
      core->http is well established (attested 19x); the engine handling Response
      objects is exactly the expected direction (high-level depends on
      low-level). Response is exported by scrapy/http/__init__.py. Not a violation.

  - host_file: "scrapy/downloadermiddlewares/offsite.py"
    source_layer: "downloadermiddlewares"
    import_line: "from scrapy.utils.httpobj import urlparse_cached"
    target_layer: "utils"
    rationale: >-
      downloadermiddlewares->utils is established (attested 22x). A middleware
      pulling a utils helper is the expected low-level dependency. urlparse_cached
      is a real function in scrapy/utils/httpobj.py. Not a violation.

  - host_file: "scrapy/spiders/sitemap.py"
    source_layer: "spiders"
    import_line: "from scrapy.http import Request"
    target_layer: "http"
    rationale: >-
      spiders->http is established (attested 8x); a spider constructing Request
      objects is idiomatic and in the correct direction. Request is exported by
      scrapy/http/__init__.py. Not a violation.

  - host_file: "scrapy/pipelines/media.py"
    source_layer: "pipelines"
    import_line: "from scrapy.utils.log import failure_to_exc_info"
    target_layer: "utils"
    rationale: >-
      pipelines->utils is established (attested 18x). A pipeline importing a
      logging helper from utils respects the layering. failure_to_exc_info is a
      real function in scrapy/utils/log.py. Not a violation.
