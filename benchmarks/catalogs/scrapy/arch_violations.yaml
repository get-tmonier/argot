# Architecture-graph violation fixtures for scrapy.
#
# Package root: scrapy/ (the dir with __init__.py). A "layer" = the first path
# component under scrapy/ (e.g. scrapy/core/engine.py -> core;
# scrapy/http/request/__init__.py -> http). Top-level modules directly in
# scrapy/ are layer __root__ and are never used as source or target here (the
# resolver's own topology never routes a real host file into/out of it).
#
# Established topology (from the learned edge graph):
#   Sinks / near-sinks (heavily imported, tiny or zero out-degree):
#     utils, http, selector, settings — each is a net importee (imported at
#     least as much as it imports out), so a brand-new outward edge from any
#     of them is a placement mistake (sink_out).
#   High-level layers (import a lot, imported by ~nobody):
#     commands (CLI; only scrapy/cmdline.py imports it), core, pipelines,
#     downloadermiddlewares & spidermiddlewares (wired via settings strings,
#     imported by no layer), extensions, contracts, linkextractors, loader.
#
# Provenance: every row below is copied VERBATIM (host_file + import_line) from
# the resolver-verified candidate menu (`argot-bench --mode arch-candidates`,
# captured at /tmp/arch-w2/candidates-scrapy.md), not hand-written git-grep
# fixtures. That menu classifies each 0-usage source_layer -> target_layer edge
# by running it through the SAME production resolver (`RepoLayering::classify`)
# the scorer uses at check time, so there is no gap between "verified 0-usage"
# and "the gate's own classifier agrees this edge is novel". `ArgotFixture` is
# a placeholder import name — the resolver only needs the dotted module path to
# classify the edge, not a real symbol, so the name carries no meaning. `pop` is
# the target layer's import-weight (in-mass) in the learned graph — how heavily
# other layers already depend on it.
#
# kind (assigned by RepoLayering::classify, crates/argot-core/src/scoring/arch_graph.rs):
#   reversal             - the direct reverse edge target->source is already
#                          attested in the graph; this would create the exact
#                          circular dependency the repo's layering avoids.
#   transitive_reversal  - no direct reverse edge, but the target layer already
#                          transitively reaches the source layer (b ->* a) via
#                          some path in the learned graph, so this new edge
#                          would close a cycle against established flow. Only
#                          visible to a resolver that tracks the whole graph —
#                          git grep on the direct pair alone cannot see it.
#   sink_out             - the source layer is a (near-)sink (net importee,
#                          listed above); a brand-new outward edge leaks out of
#                          a layer that's supposed to only be depended ON.
#   forward              - a novel edge the resolver does NOT flag (clean
#                          organic growth, or too weakly connected to violate
#                          layering). NEVER used as a `violations` row here: the
#                          gate is defined to not catch it, so authoring a
#                          "violation" fixture on a forward edge is an
#                          unwinnable miss by construction, not a scorer bug.
#                          The prior version of this file had 2 such rows,
#                          which silently capped recall at 82% no matter how
#                          good the scorer is. `forward` rows are used ONLY as
#                          `controls` here, where "does not fire" is correct.
#
# violations: predominantly reversal / transitive_reversal / sink_out — the
# realistic shape of an LLM-introduced layering mistake, and the only kinds
# the resolver is designed to catch.
# controls: `forward` edges that respect (or are neutral to) the established
# topology — new imports the resolver must NOT flag.

violations:
  # ---- sink_out (4): a near-sink layer sprouts a brand-new outward edge ----

  - host_file: "scrapy/selector/__init__.py"
    source_layer: "selector"
    import_line: "from scrapy.exceptions import ArgotFixture\n"
    target_layer: "exceptions"
    kind: "sink_out"
    rationale: >-
      selector is a near-sink (imported by http/loader/spiders, tiny
      out-degree). Resolver-verified 0-usage edge selector->exceptions (pop 80:
      exceptions is imported heavily elsewhere in the repo, just never from
      selector). Neither direction is attested, so RepoLayering::classify
      returns SinkOut, not Reversal: a sink layer leaking a brand-new outward
      dependency is a placement mistake.

  - host_file: "scrapy/http/__init__.py"
    source_layer: "http"
    import_line: "from scrapy.crawler import ArgotFixture\n"
    target_layer: "crawler"
    kind: "sink_out"
    rationale: >-
      http is a near-sink (imported by 10+ layers, out-degree ~2). 0-usage edge
      http->crawler (pop 70). crawler never imports http back, so this isn't a
      direct reversal, but a low-level sink reaching up into the top-level
      orchestration layer is exactly the kind of placement mistake sink_out
      exists to catch.

  - host_file: "scrapy/utils/__init__.py"
    source_layer: "utils"
    import_line: "from scrapy.statscollectors import ArgotFixture\n"
    target_layer: "statscollectors"
    kind: "sink_out"
    rationale: >-
      utils is the repo's most heavily imported sink (out-degree limited to a
      handful of layers). 0-usage edge utils->statscollectors (pop 12).
      statscollectors doesn't reverse-import utils either, so this is a pure
      sink leak: the most foundational layer reaching out to a mid-level
      collector is backwards.

  - host_file: "scrapy/settings/__init__.py"
    source_layer: "settings"
    import_line: "from scrapy.spiderloader import ArgotFixture\n"
    target_layer: "spiderloader"
    kind: "sink_out"
    rationale: >-
      settings is a near-sink (imported by 8+ layers, out-degree ~1: utils).
      0-usage edge settings->spiderloader (pop 6). Neither direction attested;
      settings sprouting an edge to the spider-discovery layer is a sink leak,
      not a reversal.

  # ---- transitive_reversal (5): no direct reverse edge, but the target
  #      already transitively reaches the source in the learned graph ----

  - host_file: "scrapy/settings/__init__.py"
    source_layer: "settings"
    import_line: "from scrapy.http import ArgotFixture\n"
    target_layer: "http"
    kind: "transitive_reversal"
    rationale: >-
      0-usage edge settings->http (pop 71, the largest in this file). http
      doesn't directly import settings, but http reaches settings transitively
      through the graph the resolver learned, so settings->http would close a
      cycle against established flow — TransitiveReversal, the resolver's
      whole-graph generalization of Reversal that a single-pair git grep can't
      see.

  - host_file: "scrapy/contracts/__init__.py"
    source_layer: "contracts"
    import_line: "from scrapy.settings import ArgotFixture\n"
    target_layer: "settings"
    kind: "transitive_reversal"
    rationale: >-
      0-usage edge contracts->settings (pop 35). settings transitively reaches
      contracts in the learned graph (via the same downstream chain settings
      already flows through), so a new contracts->settings edge closes a
      cycle: TransitiveReversal.

  - host_file: "scrapy/linkextractors/__init__.py"
    source_layer: "linkextractors"
    import_line: "from scrapy.settings import ArgotFixture\n"
    target_layer: "settings"
    kind: "transitive_reversal"
    rationale: >-
      0-usage edge linkextractors->settings (pop 35). Same transitive shape as
      contracts->settings above: settings already reaches linkextractors
      through the learned graph, so this closes a cycle — TransitiveReversal.

  - host_file: "scrapy/pipelines/__init__.py"
    source_layer: "pipelines"
    import_line: "from scrapy.spiders import ArgotFixture\n"
    target_layer: "spiders"
    kind: "transitive_reversal"
    rationale: >-
      0-usage edge pipelines->spiders (pop 12). spiders transitively reaches
      pipelines in the learned graph (pipelines is a high-level consumer
      downstream of spider output), so pipelines reaching back up to spiders
      closes a cycle — TransitiveReversal, not a direct-pair Reversal.

  - host_file: "scrapy/commands/__init__.py"
    source_layer: "commands"
    import_line: "from scrapy.selector import ArgotFixture\n"
    target_layer: "selector"
    kind: "transitive_reversal"
    rationale: >-
      0-usage edge commands->selector (pop 6). selector transitively reaches
      commands in the learned graph, so the CLI command layer reaching down
      into selector closes a cycle — TransitiveReversal.

  # ---- reversal (3): the direct reverse edge target->source is attested ----

  - host_file: "scrapy/http/__init__.py"
    source_layer: "http"
    import_line: "from scrapy.spiders import ArgotFixture\n"
    target_layer: "spiders"
    kind: "reversal"
    rationale: >-
      0-usage edge http->spiders (pop 12), but spiders->http IS attested in the
      graph (spiders construct Request/Response objects from http). http
      reaching up into spiders directly reverses that established direction —
      Reversal.

  - host_file: "scrapy/settings/__init__.py"
    source_layer: "settings"
    import_line: "from scrapy.spiders import ArgotFixture\n"
    target_layer: "spiders"
    kind: "reversal"
    rationale: >-
      0-usage edge settings->spiders (pop 12), while spiders->settings IS
      attested (spiders read Settings). settings importing spiders directly
      reverses the established direction — Reversal.

  - host_file: "scrapy/spiders/__init__.py"
    source_layer: "spiders"
    import_line: "from scrapy.core import ArgotFixture\n"
    target_layer: "core"
    kind: "reversal"
    rationale: >-
      0-usage edge spiders->core (pop 4), while core->spiders IS attested (the
      engine/scheduler in core drive spiders). A spider reaching back into the
      engine layer directly reverses the established direction — Reversal.

controls:
  # `forward` edges from the resolver-verified menu: novel (0-usage) but the
  # resolver's own classify() does NOT flag them (no reverse edge, no
  # transitive reversal, source is not a sink) — clean organic growth that
  # must NOT fire.

  - host_file: "scrapy/loader/__init__.py"
    source_layer: "loader"
    import_line: "from scrapy.utils import ArgotFixture\n"
    target_layer: "utils"
    rationale: >-
      forward, pop 96 (the single largest target-layer weight in the menu).
      loader is a high-level layer; utils is the repo's universal sink. Every
      layer is expected to reach into utils — the resolver does not flag it
      because it's neither a reversal, a transitive back-edge, nor a sink
      leaving its lane. Ordinary growth.

  - host_file: "scrapy/linkextractors/__init__.py"
    source_layer: "linkextractors"
    import_line: "from scrapy.exceptions import ArgotFixture\n"
    target_layer: "exceptions"
    rationale: >-
      forward, pop 80. linkextractors reaching into the shared exceptions
      module is unremarkable cross-layer growth in the established direction;
      the resolver does not classify it as a violation.

  - host_file: "scrapy/contracts/__init__.py"
    source_layer: "contracts"
    import_line: "from scrapy.crawler import ArgotFixture\n"
    target_layer: "crawler"
    rationale: >-
      forward, pop 70. contracts (a testing/validation layer) reaching up into
      the top-level crawler orchestration object is a normal forward
      dependency, not a violation.

  - host_file: "scrapy/loader/__init__.py"
    source_layer: "loader"
    import_line: "from scrapy.settings import ArgotFixture\n"
    target_layer: "settings"
    rationale: >-
      forward, pop 35. loader consulting settings is ordinary configuration
      access in the expected direction; not flagged.

  - host_file: "scrapy/spidermiddlewares/__init__.py"
    source_layer: "spidermiddlewares"
    import_line: "from scrapy.spiders import ArgotFixture\n"
    target_layer: "spiders"
    rationale: >-
      forward, pop 12. A spider middleware referencing the Spider type it
      middlewares for is the expected direction; not flagged.

  - host_file: "scrapy/spiders/__init__.py"
    source_layer: "spiders"
    import_line: "from scrapy.item import ArgotFixture\n"
    target_layer: "item"
    rationale: >-
      forward, pop 4. Spiders yielding Item objects is core, idiomatic scrapy
      usage; not flagged.
