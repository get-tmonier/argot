[workspace]
resolver = "2"
members = [
    "crates/argot-core",
    "crates/argot-lang",
    "crates/argot-engine",
    "crates/argot-rules-semantic",
    "crates/argot-rules-arch",
    "crates/argot-rules-integrity",
    "crates/argot-rules-voice",
    "crates/argot-rules-script",
    "crates/argot-cli",
    "crates/argot-bench",
]
# The cargo-fuzz harness is its own nightly/libFuzzer workspace (fuzz/), never
# part of the main build.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.127"
edition = "2021"
# Transitive deps of git2 (url → idna → ICU4X) target edition2024; 1.85 is the
# floor to build the tree. The pinned toolchain lives in rust-toolchain.toml.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/get-tmonier/argot"
homepage = "https://argot.tmonier.com"

# Several deps are chosen for stable, reproducible output, guarded by the golden
# suites (crates/argot-core/tests/*_golden.rs) rather than by freezing versions:
#   - tree-sitter grammars are kept current (core 0.26 + latest per-grammar).
#     The 0.23 → latest bump was verified to leave every golden green and the
#     honest bench flat (parse trees stable across the tokenized surface —
#     headline gated recall 85.6% and worst over-fire 1.46% both unchanged;
#     evidence in docs/research/evidence/). tree-sitter 0.26 accepts ABI 15, so
#     no grammar is held back for ABI.
#   - git2 wraps libgit2, the same C library pygit2 (1.19.2 → libgit2 1.9.x)
#     binds. gix (pure-Rust) would risk diff-hunk divergence; git2 gives exact
#     diff/find_similar output. A deliberate choice over the goal's
#     "gix preferred" default, justified by the golden gate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
# Unpinned from =0.23.0 now that tree-sitter 0.26 accepts ABI 15 (0.23.5's
# grammar); the old pin existed because tree-sitter 0.23.2 (max ABI 14) rejected it.
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
# Object Pascal (Delphi + FreePascal dialects). Uses the modern
# tree-sitter-language 0.1 binding (LANGUAGE: LanguageFn), ABI accepted by
# tree-sitter 0.26. Grammar node kinds (declUses/declProc/exprCall/…) are
# guarded by the golden suites like every other grammar.
#
# The one grammar we carry a fork of, because upstream 0.10.2 could not read
# twelve constructs mORMot, Castle Game Engine and MSEide use on nearly every
# page — Object Pascal was losing ~29 % of every line in the benchmark to an
# `ERROR` node, against 0,37 % for TypeScript. `src/parser.c` is generated and
# committed, so the build still needs only a C compiler. What was added, why,
# and how to regenerate: vendor/tree-sitter-pascal/README.md.
tree-sitter-pascal = { path = "vendor/tree-sitter-pascal" }
# Vendored libgit2, no ssh/https/openssl: argot only does local git operations,
# so we drop the network transports (openssl-sys, libssh2-sys) for a portable
# static binary. libgit2 itself is the same C library pygit2 bound, so diff
# output stays byte-identical.
# Held at 0.19 (libgit2 1.8.1): the 1.9.x blame rewrite inserts a NULL hunk
# when a commit in the blame graph has an empty author email (`name <>`) —
# `hunk_from_entry` fails, `blame_internal` inserts the NULL unchecked, and
# `git_blame_free` segfaults (reproduced on rubocop, `argot audit`
# attribution). Reported: https://github.com/libgit2/libgit2/issues/7313.
# Re-upgrade only once that lands; the `blame_survives_empty_email_author`
# test is the canary.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# The HuggingFace `tokenizers` crate: loading the exact serialised
# `tokenizer.json` gives `encode` output byte-identical to the Python
# `tokenizers` (0.22.2) that transformers wraps — re-verified across the
# 0.22 → 0.23 bump by the parity goldens. onig feature matches the regex
# engine the Python wheels ship with.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# MinHash uses md5(callee) — hashlib.md5 parity.
md-5 = "0.11"
# Hit hashes (suppression surface) — pure-Rust SHA-256.
sha2 = "0.11"
# `.argot/suppressions.yaml` loader — pure Rust (unsafe-libyaml), keeps the
# single-static-binary story.
serde_yaml = "0.9"
# `argot.toml` config surface: `toml` for serde reads, `toml_edit` for
# format-preserving writes (mute append / prune keep the user's hand edits and
# comments). Pure Rust — no effect on the parity-pinned deps.
toml = "1"
toml_edit = "0.25"
# `argot update` self-update (crates/argot-cli/src/update.rs): the flow is
# hand-rolled — version from the published version.json, installer from the
# release's web download URL — so it never touches the GitHub API and its
# anonymous 60 req/h rate limit. self-replace is the Windows-only cleanup of
# the parked old binary after an in-place update (unix needs no dance).
self-replace = "1.5"
# HTTP client for `self-update` (version.json + installer fetch). The semantic
# model is embedded in the binary, so enabling `semantic` does not add a model
# download path.
ureq = { version = "2", default-features = false, features = ["tls"] }
# f16 canonicalisation of embedding vectors, and f16/bf16 weight decoding.
half = { version = "2", features = ["serde"] }
# Compact base64 packing of the f16 index vectors in the (gitignored) artifact.
base64 = "0.22"

# Workspace-wide lints, inherited by every member crate via `[lints] workspace =
# true`. argot's own code contains no `unsafe`; deny it at compile time so it
# cannot be introduced without a deliberate, reviewed `#[allow(unsafe_code)]`.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
