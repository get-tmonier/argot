[workspace]
resolver = "2"
members = [
    "crates/argot-core",
    "crates/argot-lang",
    "crates/argot-engine",
    "crates/argot-rules-semantic",
    "crates/argot-rules-arch",
    "crates/argot-rules-integrity",
    "crates/argot-rules-voice",
    "crates/argot-rules-script",
    "crates/argot-cli",
    "crates/argot-bench",
]
# The cargo-fuzz harness is its own nightly/libFuzzer workspace (fuzz/), never
# part of the main build.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.70"
edition = "2021"
# Transitive deps of git2 (url → idna → ICU4X) target edition2024; 1.85 is the
# floor to build the tree. The pinned toolchain lives in rust-toolchain.toml.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/get-tmonier/argot"
homepage = "https://argot.tmonier.com"

# Dependency versions are pinned for parity with the Python engine being
# replaced:
#   - tree-sitter grammars must match the ABI/grammar the Python engine used
#     (tree_sitter 0.23.2, python 0.23.6, typescript 0.23.2, javascript 0.23.1)
#     so parse trees — and therefore tokenization — are byte-identical.
#   - git2 wraps libgit2, the SAME C library pygit2 (1.19.2 → libgit2 1.9.x)
#     binds. gix (pure-Rust) would risk diff-hunk divergence; git2 gives exact
#     diff/find_similar parity. This is a deliberate choice over the goal's
#     "gix preferred" default, justified by the parity gate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-c = "0.23"
tree-sitter-java = "0.23"
# Pinned to 0.23.0: later 0.23.x (0.23.5) ship a grammar built at ABI 15, which
# tree-sitter 0.23.2 (max ABI 14) rejects with LanguageError. 0.23.0 is ABI 14.
tree-sitter-c-sharp = "=0.23.0"
tree-sitter-php = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
# Vendored libgit2, no ssh/https/openssl: argot only does local git operations,
# so we drop the network transports (openssl-sys, libssh2-sys) for a portable
# static binary. libgit2 itself is the same C library pygit2 bound, so diff
# output stays byte-identical.
# Held at 0.19 (libgit2 1.8.1): the 1.9.x blame rewrite inserts a NULL hunk
# when a commit in the blame graph has an empty author email (`name <>`) —
# `hunk_from_entry` fails, `blame_internal` inserts the NULL unchecked, and
# `git_blame_free` segfaults (reproduced on rubocop, `argot audit`
# attribution). Reported: https://github.com/libgit2/libgit2/issues/7313.
# Re-upgrade only once that lands; the `blame_survives_empty_email_author`
# test is the canary.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# Same codebase as the Python `tokenizers` (0.22.2) that transformers wraps;
# loading the exact serialised `tokenizer.json` gives bit-identical `encode`.
# onig feature matches the regex engine the Python wheels ship with.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# MinHash uses md5(callee) — hashlib.md5 parity.
md-5 = "0.10"
# Hit hashes (suppression surface) — pure-Rust SHA-256.
sha2 = "0.10"
# `.argot/suppressions.yaml` loader — pure Rust (unsafe-libyaml), keeps the
# single-static-binary story.
serde_yaml = "0.9"
# `argot.toml` config surface: `toml` for serde reads, `toml_edit` for
# format-preserving writes (mute append / prune keep the user's hand edits and
# comments). Pure Rust — no effect on the parity-pinned deps.
toml = "1"
toml_edit = "0.25"
# `argot update` self-update (crates/argot-cli/src/update.rs): the flow is
# hand-rolled — version from the published version.json, installer from the
# release's web download URL — so it never touches the GitHub API and its
# anonymous 60 req/h rate limit. self-replace is the Windows-only cleanup of
# the parked old binary after an in-place update (unix needs no dance).
self-replace = "1.5"
# Semantic layer (feature-gated `semantic`, off by default): llama.cpp linked
# statically for in-process code embeddings (jina-code Q4 GGUF). Same in-process
# C-dep shape as git2/libgit2. Metal is enabled per-target in argot-core. None
# of these touch the base statistical path — they exist only under `semantic`.
llama-cpp-2 = { version = "0.1.151", default-features = false }
# One-time fetch-on-first-use of the ~90 MB GGUF (blocking, rustls TLS — pure
# Rust, preserves the static-binary story). Feature-gated behind `semantic`
# and `self-update` (version.json + installer fetch).
ureq = { version = "2", default-features = false, features = ["tls"] }
# f16 storage for the semantic index vectors (~4 MB / 2.6k fns in the artifact).
half = { version = "2", features = ["serde"] }
# Compact base64 packing of the f16 index vectors in the (gitignored) artifact.
base64 = "0.22"

# Workspace-wide lints, inherited by every member crate via `[lints] workspace =
# true`. argot's own code contains no `unsafe`; deny it at compile time so it
# cannot be introduced without a deliberate, reviewed `#[allow(unsafe_code)]`.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
