# Dependabot keeps dependencies and CI actions patched, and — together with the
# repo's Dependabot security updates — opens PRs when a dependency draws an
# advisory. Note: many Cargo deps are deliberately version-pinned for parity
# with the Python engine (see the root Cargo.toml); those PRs are triaged and
# often closed, but the alert itself is the value. cargo-deny (deny.toml) is the
# gating check in CI.
version: 2
updates:
  # Rust dependencies (whole workspace).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the low-risk churn; majors still come in on their own.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — keeps the SHA-pinned third-party actions current
  # (Dependabot rewrites the pinned SHA and updates the trailing version tag).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  # Landing site (Astro) dependencies.
  - package-ecosystem: npm
    directory: "/landing"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(landing-deps)"
    groups:
      landing-minor-patch:
        update-types:
          - minor
          - patch
