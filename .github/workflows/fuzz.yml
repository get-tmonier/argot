name: fuzz

# Weekly (and on-demand) fuzzing of argot's untrusted-input parsers — kept OFF
# the PR path (nightly + libFuzzer + a cargo-fuzz build are too heavy for every
# PR). A short bounded run per target catches easy crashes and stops the
# harnesses (fuzz/) from rotting. See fuzz/README.md.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins `stable` and a toolchain file beats `rustup
    # default`, so nightly must come from the env — cargo-fuzz propagates it to
    # the nested `cargo build` that carries `-Zsanitizer=address`.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [tokenize, ts_parse]
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain (libFuzzer needs nightly)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (bounded)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=4096
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
