name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  # The shipped binary fetches the semantic model from a pinned release asset.
  # That contract is otherwise purely manual — if the asset went missing or its
  # bytes changed, every user download would degrade to a no-op. Verify the
  # exact URL and sha256 the code pins BEFORE tagging a release.
  verify-model-asset:
    name: Verify pinned semantic-model asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the pinned GGUF and check its sha256
        run: |
          SRC=crates/argot-rules-semantic/src/embedder.rs
          URL=$(grep -o 'https://[^"]*\.gguf' "$SRC" | head -1)
          SHA=$(grep -m1 'MODEL_SHA256' "$SRC" | grep -o '[0-9a-f]\{64\}')
          echo "pinned: $URL"
          echo "expect: $SHA"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o model.gguf "$URL"
          GOT=$(sha256sum model.gguf | cut -d' ' -f1)
          echo "got:    $GOT"
          test "$GOT" = "$SHA"

  bump-and-tag:
    name: Bump patch version and tag
    needs: verify-model-asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT required: GITHUB_TOKEN pushes don't trigger downstream workflows
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Skip if this is a release commit
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE '^chore: release v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version (Cargo.toml is the source of truth)
        if: steps.check.outputs.skip == 'false'
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "0,/^version = .*/s//version = \"$NEW\"/" Cargo.toml
          cargo update -p argot-core -p argot
          # Stamp the release into the landing tree. Cloudflare Pages builds
          # with root directory `landing/`, so a release commit that only
          # touches Cargo.toml never triggers a site rebuild — and
          # /version.json (built from ../Cargo.toml, and what `argot update`
          # + the daily notice resolve against) goes stale. Touching this
          # file makes every release commit rebuild the site.
          printf '{\n  "version": "%s"\n}\n' "$NEW" > landing/src/data/release.json
          # Keep the MCP registry manifest in lockstep (server + npm package version).
          if [ -f server.json ]; then
            jq --arg v "$NEW" '.version = $v | (.packages[]?.version) = $v' server.json > server.json.tmp && mv server.json.tmp server.json
          fi

      - name: Commit, tag and push
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock landing/src/data/release.json server.json
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
