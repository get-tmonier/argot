name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  bump-and-tag:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT required: GITHUB_TOKEN pushes don't trigger downstream workflows
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Skip if this is a release commit
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE '^chore: release v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version (Cargo.toml is the source of truth)
        if: steps.check.outputs.skip == 'false'
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "0,/^version = .*/s//version = \"$NEW\"/" Cargo.toml
          cargo update -p argot-core -p argot

      - name: Commit, tag and push
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
