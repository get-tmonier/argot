name: Argot UI demo (disposable)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  voice:
    name: Argot review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Argot reads the reviewed snapshot from the PR base.
      # Build and run this PR's Action + renderer so reviewers can inspect the
      # unreleased card. This workflow is only for the disposable demo PR.
      - run: cargo build --quiet -p argot
      - uses: ./
        with:
          argot-version: local
          format: github
          upload-sarif: false
          fail-on-hits: false # Advisory: a finding never blocks this job.
