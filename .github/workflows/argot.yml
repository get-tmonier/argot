name: Argot

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  voice:
    name: Argot review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Argot reads the reviewed snapshot from the PR base.
      # The Action downloads the latest released Argot CLI by default.
      - uses: get-tmonier/argot@main
        with:
          fail-on-hits: false # Advisory: a finding never blocks this job.
