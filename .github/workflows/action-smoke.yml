name: Action installation smoke

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - .github/fixtures/action-smoke/**
      - README.md
      - skills/argot-setup/SKILL.md
      - skills/argot-setup-ci/SKILL.md
      - landing/src/content/docs/setup-prompt.md
      - landing/src/content/docs/ci.md
      - landing/src/content/docs/getting-started.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Action findings contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assert renderer snapshots and Action state contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p argot voice_diff::tests
          grep -Fq 'No configured findings on {} scanned hunks.' crates/argot-cli/src/voice_diff.rs
          grep -Fq 'Non-blocking by default' action.yml
          grep -Fq 'argot-configured-findings' action.yml
          grep -Fq 'fit-recommendation:' action.yml
          grep -Fq '#### Fit snapshot: ${RECOMMENDATION//_/ }' action.yml
          grep -Fq 'none) action_text="No maintenance is needed."' action.yml
          grep -Fq '"message":"unknown","color":"lightgrey"' action.yml
          grep -Fq 'Fail the job when argot finds hunks above the calibrated threshold.' action.yml
          grep -Fq "echo '::error::The base branch has no committed Argot fit snapshot. For first setup, merge a reviewed argot.toml and .argot/ snapshot into the base branch before adding this workflow; CI never fits. Then retry.'" action.yml
          ! grep -Fq 'Run `argot init` locally' action.yml
          grep -Fq '**Bootstrap boundary.** Do not add this workflow to the first PR' skills/argot-setup/SKILL.md
          grep -Fq 'snapshot **already on the PR base/default branch**' skills/argot-setup-ci/SKILL.md
          grep -Fq 'If CI is requested, its workflow comes only after that commit has been' landing/src/content/docs/setup-prompt.md
          grep -Fq 'two-step bootstrap' landing/src/content/docs/ci.md
          grep -Fq 'future pull requests target before enabling CI.' landing/src/content/docs/getting-started.md
          grep -Fq 'initial snapshot PR must be separate from the' README.md
          expected_condition='if: $'
          expected_condition+='{{ inputs.fail-on-hits == '\''true'\'' && steps.check.outputs.exit-code == '\''1'\'' }}'
          grep -Fq "$expected_condition" action.yml
          ! grep -Eiq 'in-voice|out-of-voice|voice score|score card' action.yml

  linux:
    name: Linux Action ${{ matrix.scenario }} smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # `clean` stays pinned to an old release: that scenario's job is the
        # installer contract. The others run `latest`, because pinning every
        # scenario meant the smoke never exercised a shipped binary — which is
        # how a SARIF document missing a schema-required property reached users.
        scenario: [clean, finding, sarif]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create fixture repository
        id: fixture
        shell: bash
        run: |
          fixture="${RUNNER_TEMP}/argot-action-${{ matrix.scenario }}"
          kind="${{ matrix.scenario }}"
          # `sarif` is the `finding` fixture seen through the default format.
          [ "$kind" = sarif ] && kind=finding
          cargo build --quiet -p argot
          fixture_argot="$GITHUB_WORKSPACE/target/debug/argot"
          [ -x "${fixture_argot}.exe" ] && fixture_argot="${fixture_argot}.exe"
          ARGOT_FIXTURE_ARGOT="$fixture_argot" .github/fixtures/action-smoke/create-repo.sh "$fixture" "$kind"
          echo "path=$fixture" >> "$GITHUB_OUTPUT"
      - name: Run local Action
        id: action
        uses: ./
        with:
          path: ${{ steps.fixture.outputs.path }}
          argot-version: local
          ref: HEAD~1..HEAD
          # `github` produces workflow commands for a finding, while JSON keeps
          # the clean case a stable machine-readable result.
          # `sarif` takes the Action's own default, which is the whole point.
          format: ${{ matrix.scenario == 'finding' && 'github' || matrix.scenario == 'sarif' && 'sarif' || 'json' }}
          output-file: ${{ runner.temp }}/argot-${{ matrix.scenario }}.out
          semantic: false
          upload-sarif: false
          comment-pr: false
      - name: Assert install, non-blocking result, and summary
        shell: bash
        env:
          ACTION_EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          ACTION_OUTCOME: ${{ steps.action.outcome }}
          FIT_RECOMMENDATION: ${{ steps.action.outputs.fit-recommendation }}
          FIT_NEXT_ACTION: ${{ steps.action.outputs.fit-next-action }}
          FIT_SUMMARY: ${{ steps.action.outputs.fit-summary }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          argot --version | grep -E '^argot [0-9]+'
          # A finding is reported through the Action output, but the Action
          # itself succeeds unless the caller explicitly opts into gating.
          test "$ACTION_OUTCOME" = success
          case "$SCENARIO" in
            clean) test "$ACTION_EXIT_CODE" = 0 ;;
            finding|sarif) test "$ACTION_EXIT_CODE" = 1 ;;
          esac
          # The action exposes the same base-snapshot freshness state that it
          # puts in the job summary and sticky PR card. A PR's new code must
          # not make the already-committed base snapshot read as stale.
          test "$FIT_RECOMMENDATION" = fresh
          test "$FIT_NEXT_ACTION" = none
          test -n "$FIT_SUMMARY"
          # `voice-diff` is deliberately best-effort when semantic indexing is
          # disabled, so a missing optional card must not fail this smoke test.
      # What github/codeql-action/upload-sarif validates before it accepts a
      # document. The Rust suite asserts this contract on the renderer; here it
      # is asserted on the artefact the Action actually hands to GitHub.
      - name: Assert the SARIF carries every schema-required property
        if: ${{ matrix.scenario == 'sarif' }}
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/argot-sarif.out
        run: |
          set -euo pipefail
          jq -e '.version == "2.1.0"' "$RESULTS" > /dev/null
          jq -e '.runs | length > 0' "$RESULTS" > /dev/null
          jq -e 'all(.runs[]; .tool.driver.name != null)' "$RESULTS" > /dev/null
          jq -e '[.runs[].tool.driver.rules // [] | .[] | select(.id == null)] | length == 0' "$RESULTS" > /dev/null
          jq -e '[.runs[].invocations // [] | .[] | select(.executionSuccessful == null)] | length == 0' "$RESULTS" > /dev/null
          jq -e '[.runs[].results // [] | .[] | select(.message.text == null)] | length == 0' "$RESULTS" > /dev/null
          echo "SARIF: every schema-required property present"

      - name: Publish finding annotations
        if: ${{ matrix.scenario == 'finding' }}
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/argot-finding.out
        run: |
          set -euo pipefail
          # The Action keeps its chosen output format in its declared result
          # file. Replaying GitHub workflow commands here asserts that the
          # finding can surface as a hosted-runner annotation without gating.
          grep -Eq '^::(warning|error)' "$RESULTS"
          cat "$RESULTS"

  macos:
    name: macOS ARM64 Action install smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Confirm expected runner architecture
        shell: bash
        run: test "$RUNNER_ARCH" = ARM64
      - name: Create clean fixture repository
        id: fixture
        shell: bash
        run: |
          fixture="${RUNNER_TEMP}/argot-action-clean"
          cargo build --quiet -p argot
          fixture_argot="$GITHUB_WORKSPACE/target/debug/argot"
          [ -x "${fixture_argot}.exe" ] && fixture_argot="${fixture_argot}.exe"
          ARGOT_FIXTURE_ARGOT="$fixture_argot" .github/fixtures/action-smoke/create-repo.sh "$fixture" clean
          echo "path=$fixture" >> "$GITHUB_OUTPUT"
      - name: Run local Action
        uses: ./
        with:
          path: ${{ steps.fixture.outputs.path }}
          argot-version: local
          ref: HEAD~1..HEAD
          format: json
          output-file: ${{ runner.temp }}/argot-macos.json
          semantic: false
          upload-sarif: false
          comment-pr: false
      - name: Assert local test binary is available
        shell: bash
        run: argot --version | grep -E '^argot [0-9]+'

  windows:
    name: Windows Action install smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create clean fixture repository
        id: fixture
        shell: bash
        run: |
          fixture="${RUNNER_TEMP}/argot-action-clean"
          cargo build --quiet -p argot
          fixture_argot="$GITHUB_WORKSPACE/target/debug/argot"
          [ -x "${fixture_argot}.exe" ] && fixture_argot="${fixture_argot}.exe"
          ARGOT_FIXTURE_ARGOT="$fixture_argot" .github/fixtures/action-smoke/create-repo.sh "$fixture" clean
          echo "path=$fixture" >> "$GITHUB_OUTPUT"
      - name: Run local Action
        uses: ./
        with:
          path: ${{ steps.fixture.outputs.path }}
          argot-version: local
          ref: HEAD~1..HEAD
          format: json
          output-file: ${{ runner.temp }}/argot-windows.json
          semantic: false
          upload-sarif: false
          comment-pr: false
      - name: Assert local test binary is available
        shell: pwsh
        run: |
          $binary = (Get-Command argot).Source
          & $binary --version | Select-String -SimpleMatch 'argot '

  negative-install:
    name: Action ${{ matrix.mode }} failure smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [missing, checksum-mismatch]
    steps:
      - uses: actions/checkout@v5
      - name: Install fixture curl
        shell: bash
        run: |
          fixture_bin="${RUNNER_TEMP}/argot-action-fixture-bin"
          mkdir -p "$fixture_bin"
          cp .github/fixtures/action-smoke/curl "$fixture_bin/curl"
          chmod +x "$fixture_bin/curl"
          echo "$fixture_bin" >> "$GITHUB_PATH"
      - name: Run local Action with invalid release asset
        id: action
        continue-on-error: true
        uses: ./
        env:
          ARGOT_ACTION_FIXTURE_MODE: ${{ matrix.mode }}
        with:
          argot-version: 0.2.82
          semantic: false
          upload-sarif: false
          comment-pr: false
      - name: Assert safe installation failure
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
          MODE: ${{ matrix.mode }}
        run: |
          test "$ACTION_OUTCOME" = failure
          case "$MODE" in
            missing) echo "Missing release asset stopped installation." ;;
            checksum-mismatch) echo "Checksum mismatch stopped installation." ;;
          esac

  missing-snapshot:
    name: Action missing snapshot never fits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create an unfitted fixture repository
        id: fixture
        shell: bash
        run: |
          fixture="${RUNNER_TEMP}/argot-action-unfitted"
          .github/fixtures/action-smoke/create-repo.sh "$fixture" clean
          echo "path=$fixture" >> "$GITHUB_OUTPUT"
      - name: Build the local Action binary
        shell: bash
        run: cargo build --quiet -p argot
      - name: Run the Action against the unfitted fixture
        id: action
        continue-on-error: true
        uses: ./
        with:
          path: ${{ steps.fixture.outputs.path }}
          argot-version: local
          ref: HEAD
          semantic: false
          upload-sarif: false
          comment-pr: false
      - name: Assert the setup error did not fit
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
          FIXTURE: ${{ steps.fixture.outputs.path }}
        run: |
          set -euo pipefail
          test "$ACTION_OUTCOME" = failure
          test ! -e "$FIXTURE/argot.toml"
          test ! -e "$FIXTURE/.argot"
