<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <style>
    /* Canonical wordmark: "ar" + "ot" in ink, the "g" in ember. Ink follows the
       reader's theme so it stays legible on GitHub's light and dark backgrounds. */
    .ink { fill: #0c0a09; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f4ece5; } }
  </style>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="48" font-weight="700">
    <text x="16" y="56" class="ink">a</text>
    <text x="46" y="56" class="ink">r</text>
    <text x="76" y="60" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="900" font-size="58" fill="#e67e45">g</text>
    <text x="114" y="56" class="ink">o</text>
    <text x="144" y="56" class="ink">t</text>
  </g>
</svg>
